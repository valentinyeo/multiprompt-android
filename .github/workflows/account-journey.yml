name: Account layout journey

on:
  schedule:
    - cron: '23 3 * * *'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'tools/account-journey/**'
      - '.github/workflows/account-journey.yml'
      - '.github/actions/android-proof/**'
  workflow_dispatch:
    inputs:
      rename_only:
        description: Prove shared session rename through Android and the desktop account feed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: account-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EVIDENCE: ${{ github.workspace }}/account-journey-evidence
      FIXTURE: ${{ github.workspace }}-journey-fixture
      MULTIPROMPT_DIR: ${{ github.workspace }}/multiprompt
      RENAME_ONLY: ${{ inputs.rename_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: valentinyeo/multiprompt
          ref: master
          path: multiprompt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build the account service for the local journey
        working-directory: multiprompt/service
        run: |
          npm ci
          npx wrangler deploy --dry-run --outdir .build
      - name: Reject stale account names on the original source
        run: |
          file=app/src/main/java/dev/multiprompt/companion/account/AccountHostMap.kt
          cp "$file" "$RUNNER_TEMP/AccountHostMap.kt"
          trap 'cp "$RUNNER_TEMP/AccountHostMap.kt" "$file"' EXIT
          git fetch origin eb29d0a1c7dc3d5032d89820fa6480a687cb85db
          git show eb29d0a1c7dc3d5032d89820fa6480a687cb85db:"$file" > "$file"
          if gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g testDebugUnitTest --tests '*AccountSplitParityTest*'; then
            echo 'Original stale-name projection unexpectedly passed' >&2
            exit 1
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = 'app/build/test-results/testDebugUnitTest/TEST-dev.multiprompt.companion.account.AccountSplitParityTest.xml'
          case = ET.parse(path).getroot().find("testcase[@name='renamedAccountSessionUsesOneNameInInboxReaderAndPersistedLayout']")
          assert case is not None and case.find('failure') is not None
          assert 'Renamed session' in case.find('failure').get('message')
          print('ORIGINAL_RENAME_REGRESSION_REPRODUCED')
          PY
          mkdir -p "$EVIDENCE"
          cp app/build/test-results/testDebugUnitTest/TEST-dev.multiprompt.companion.account.AccountSplitParityTest.xml "$EVIDENCE/original-regression.xml"
          cp "$RUNNER_TEMP/AccountHostMap.kt" "$file"
          trap - EXIT
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g testDebugUnitTest --tests '*AccountSplitParityTest*'
          cp app/build/test-results/testDebugUnitTest/TEST-dev.multiprompt.companion.account.AccountSplitParityTest.xml "$EVIDENCE/fixed-regression.xml"
      - name: Build debug app pointed at the local service
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g -PaccountOrigin=http://10.0.2.2:8787 assembleDebug assembleDebugAndroidTest
      - name: Start the ssh and tmux fixture
        run: bash tools/account-journey/fixture.sh
      - uses: ./.github/actions/android-proof
        with:
          stage: stage-1
          target: google_apis
          script: |
            bash -c 'adb install -r -g app/build/outputs/apk/debug/app-debug.apk && adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk && tools/account-journey/drive.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-journey-android
          path: account-journey-evidence/
          if-no-files-found: error
          retention-days: 14
