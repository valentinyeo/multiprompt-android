name: Android scroll-under proof

on:
  pull_request:
    paths:
      - '.github/actions/android-proof/**'
      - 'app/**'
      - 'gradle/**'
      - 'tools/top-fade-proof.sh'
      - '.github/workflows/top-fade.yml'
  push:
    branches: [main, ceo/IGSH-1077]
  workflow_dispatch:
    inputs:
      release_smoke:
        description: Install and verify the published signed APK after screen tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: top-fade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - uses: ./.github/actions/android-proof
        env:
          RELEASE_SMOKE: ${{ inputs.release_smoke }}
        with:
          target: default
          stage: stage-1
          script: tools/top-fade-proof.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top-fade-emulator-proof
          path: |
            build/top-fade-shots/**
            build/top-fade-diagnostics/**
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
