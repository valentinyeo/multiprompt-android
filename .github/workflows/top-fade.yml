name: Android scroll-under proof

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'tools/top-fade-proof.sh'
      - '.github/workflows/top-fade.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_smoke:
        description: Install and verify the published signed APK after screen tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: top-fade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Install emulator exit tracer
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          RELEASE_SMOKE: ${{ inputs.release_smoke }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan -verbose > /tmp/top-fade-emulator.log 2>&1
          disable-animations: true
          script: |
            mkdir -p build/top-fade-diagnostics
            sudo strace -f -e trace=process -e signal=all -p "$(pgrep -f '^/usr/local/lib/android/sdk/emulator/qemu/linux-x86_64/qemu-system-x86_64')" -o /tmp/top-fade-exit.txt > /tmp/top-fade-tracer.txt 2>&1 &
            tools/top-fade-proof.sh
      - name: Retain emulator diagnostics
        if: always()
        run: |
          mkdir -p build/top-fade-diagnostics
          if [ -f /tmp/top-fade-emulator.log ]; then
            cp /tmp/top-fade-emulator.log build/top-fade-diagnostics/emulator.txt
          fi
          sudo cp /tmp/top-fade-{exit,tracer}.txt build/top-fade-diagnostics/
          sudo dmesg -T > build/top-fade-diagnostics/kernel.txt
          free -m > build/top-fade-diagnostics/memory.txt
          ps -eo pid,ppid,stat,rss,args > build/top-fade-diagnostics/processes.txt
          if [ -d /tmp/android-runner ]; then
            cp -a /tmp/android-runner build/top-fade-diagnostics/crashes
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top-fade-emulator-proof
          path: |
            build/top-fade-shots/**
            build/top-fade-diagnostics/**
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
