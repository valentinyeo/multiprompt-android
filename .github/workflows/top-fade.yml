name: Android scroll-under proof

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'tools/top-fade-proof.sh'
      - '.github/workflows/top-fade.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_smoke:
        description: Install and verify the published signed APK after screen tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: top-fade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          RELEASE_SMOKE: ${{ inputs.release_smoke }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: tools/top-fade-proof.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top-fade-emulator-proof
          path: |
            build/top-fade-shots/**
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
