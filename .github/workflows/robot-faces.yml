name: Robot faces visual proof

on:
  push:
    branches: [ceo/IGSH-1151, ceo/IGSH-1172, ceo/IGSH-1172-generic]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robot-faces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - uses: ./.github/actions/android-proof
        with:
          stage: robot-faces
          script: bash tools/robot-faces/proof.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-faces-proof
          path: |
            build/robot-faces/**
            app/build/reports/androidTests/connected/**
          retention-days: 7
