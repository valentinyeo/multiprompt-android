name: Claude review

on:
  workflow_run:
    workflows: ["Claude review request"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('claude-review-{0}', github.event.workflow_run.head_sha) || format('claude-review-pr-{0}', inputs.pr) }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Sonnet reviews this pull request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Resolve the pull request
        id: target
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          PR_INPUT: ${{ inputs.pr }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            let number = Number(process.env.PR_INPUT);
            if (run) {
              const { data: open } = await github.rest.pulls.list({ owner, repo, state: 'open', base: 'main', per_page: 100 });
              number = open.find(pr => pr.head.sha === run.head_sha && pr.head.repo?.full_name === `${owner}/${repo}`)?.number;
            }
            if (!Number.isInteger(number) || number < 1) {
              core.notice('skipped: no open pull request from this repository has this head');
              core.setOutput('go', 'no');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const ok = pr.state === 'open' && !pr.draft
              && pr.head.repo?.full_name === `${owner}/${repo}`
              && pr.base.ref === 'main'
              && pr.user?.login !== 'dependabot[bot]';
            core.setOutput('number', String(number));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('go', ok ? 'yes' : 'no');
            if (!ok) core.notice(`skipped: state=${pr.state} draft=${pr.draft} head=${pr.head.sha}`);
      - name: Require the Claude subscription token
        if: steps.target.outputs.go == 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::The repo secret CLAUDE_CODE_OAUTH_TOKEN is empty or missing. No paid API key is used as a fallback."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.target.outputs.go == 'yes'
        with:
          node-version: ^24.22.1
          check-latest: true
      - name: Install the pinned Claude Code CLI
        if: steps.target.outputs.go == 'yes'
        run: npm install --global @anthropic-ai/claude-code@2.1.325
      - name: Review the diff
        id: review
        if: steps.target.outputs.go == 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ steps.target.outputs.number }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
        run: node .github/scripts/claude-review/claude-review.cjs
      - name: Publish the claude-review check for this head
        if: steps.target.outputs.go == 'yes' && steps.review.outputs.verdict != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          REVIEW_VERDICT: ${{ steps.review.outputs.verdict }}
          REVIEW_PR: ${{ steps.target.outputs.number }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const approved = process.env.REVIEW_VERDICT === 'APPROVE';
            await github.rest.checks.create({
              owner,
              repo,
              name: 'claude-review',
              head_sha: process.env.REVIEW_SHA,
              status: 'completed',
              conclusion: approved ? 'success' : 'failure',
              output: {
                title: approved ? 'No blocker or major findings' : 'Blocker or major findings',
                summary: `Claude Sonnet reviewed this head. The findings are in the review comment on pull request #${process.env.REVIEW_PR}.`,
              },
            });
