name: Multiprompt parity
on:
  schedule:
    - cron: '23 3 * * *'
  pull_request:
    paths:
      - 'tools/parity/**'
      - 'docs/multiprompt-features.md'
      - '.github/workflows/multiprompt-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove counterparts, retries, and inventory
        run: python3 tools/parity/multiprompt-parity.test.py
