name: Emulator stability series

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      feature_map:
        description: Run weekly feature-map maintenance instead of the stability series
        type: boolean
        default: false
      dry_run:
        description: Plan feature-map journeys and check sources without driving Android or publishing a PR
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: emulator-stability-${{ github.ref }}
  cancel-in-progress: ${{ inputs.feature_map == true }}

jobs:
  maintenance:
    if: inputs.feature_map == true
    uses: ./.github/workflows/maintain-verification.yml
    with:
      dry_run: ${{ inputs.dry_run }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    secrets: inherit

  series:
    if: inputs.feature_map != true
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - name: Consecutive real proof runs
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_REF: ${{ github.ref_name }}
          PROOF_COMMIT: ${{ github.sha }}
          PROOF_COUNT: ${{ github.ref_name == 'main' && '5' || '3' }}
        run: bash .github/actions/android-proof/series.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-stability-series
          path: stability-evidence/
          if-no-files-found: error
