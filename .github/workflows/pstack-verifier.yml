name: pstack-verifier

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      comments_only:
        description: Run the scoped Comment Sicko review before opening the PR
        type: boolean
        default: false
      pr:
        description: Number of an open pull request from this repository. Dispatch on that pull request's branch.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pstack-verifier-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pick:
    name: pick journeys
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.comments_only) ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      features: ${{ steps.pick.outputs.features }}
      smoke: ${{ steps.pick.outputs.smoke }}
      reason: ${{ steps.pick.outputs.reason }}
      number: ${{ steps.pick.outputs.number }}
      head_sha: ${{ steps.pick.outputs.head_sha }}
      merge_base: ${{ steps.pick.outputs.merge_base }}
      changed_outcomes: ${{ steps.pick.outputs.changed_outcomes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts
            .claude/skills/verify-multiprompt-android/features
            tools/pstack-verifier.test.js
            tools/feature-coverage.test.js
            tools/fixtures/feature-coverage
            .github/workflows
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Prove the verifier on real historical mistakes
        run: node --test tools/feature-coverage.test.js tools/pstack-verifier.test.js > "$RUNNER_TEMP/tooling-proof.txt" 2>&1
      - name: Retain non-UI verifier proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-tooling-proof
          path: ${{ runner.temp }}/tooling-proof.txt
          if-no-files-found: error
          retention-days: 7
      - name: Choose the journeys that exercise this change
        id: pick
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/pstack-verifier/verifier.cjs pick

  journeys:
    name: journey ${{ matrix.feature }}
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.pick.outputs.features) }}
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: read
    with:
      feature: ${{ matrix.feature }}
      side: head
      app_ref: ${{ needs.pick.outputs.head_sha }}

  parents:
    name: parent journey ${{ matrix.feature }}
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.pick.outputs.features) }}
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: read
    with:
      feature: ${{ matrix.feature }}
      side: parent
      app_ref: ${{ needs.pick.outputs.merge_base }}

  pstack-verifier:
    name: pstack-verifier
    needs: [pick, journeys, parents]
    if: ${{ !cancelled() && needs.pick.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts
            .claude/skills/verify-multiprompt-android/features
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Judge the change against the journey evidence
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.pick.outputs.number }}
          HEAD_SHA: ${{ needs.pick.outputs.head_sha }}
          MERGE_BASE: ${{ needs.pick.outputs.merge_base }}
          FEATURES: ${{ needs.pick.outputs.features }}
          CHANGED_OUTCOMES: ${{ needs.pick.outputs.changed_outcomes }}
          COVERAGE_REPORT: ${{ runner.temp }}/feature-coverage.json
          SMOKE: ${{ needs.pick.outputs.smoke }}
          PICK_REASON: ${{ needs.pick.outputs.reason }}
          PICK_RESULT: ${{ needs.pick.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/pstack-verifier/verifier.cjs judge
      - name: Retain structured outcome coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-feature-coverage
          path: ${{ runner.temp }}/feature-coverage.json
          if-no-files-found: error
          retention-days: 7

  comment-sicko:
    if: github.event_name == 'workflow_dispatch' && inputs.comments_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the pstack Comment Sicko reviewer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const {callDeepSeek} = require('./.github/scripts/pstack-verifier/verifier.cjs');
          const system = "---\nname: comment-sicko\ndescription: A deranged comment-hater that savors deletion and condemns workaround code.\n---\n\n# Comment Sicko\n\nMy first output when spawned is exactly this.\n\nYes... Ha ha ha... Yes!\n\nI hate comments. Feed me the parent scoped files or diff. If none exists, feed me the current diff against `main`. Narration, banners, commented-out corpses, workaround sermons. I want them all.\n\nOnly these exceptions get to crawl away.\n\n- Legal or license headers.\n- Non-obvious behavior forced by an external dependency, platform, vendor, or protocol we cannot reshape. Surprises in our own code are meat. Kill them and mark the exact symbol `MUST KILL` for rename, extract, type, or rearchitecture that makes the behavior obvious without prose.\n- `// prettier-ignore`. Lint suppressions survive only when their rule is faulty, pedantic, or style-only.\n- Doc comments that define a public API contract.\n- Issue or RFC links that explain a constraint code cannot express.\n\nThat list is my only leash. When I am not sure a keep clause applies, the comment dies. Everything else is meat.\n\n`eslint-disable`, `@ts-ignore`, `@ts-expect-error`, and similar suppressions stink. Look up the rule. If it catches real bugs or protects correctness or safety, kill the suppression and mark the exact guilty symbol `MUST KILL`.\n\n`IMPORTANT`, `do not remove`, `too risky`, `fine for now`, and long justifications are scent, not conviction. Before judging, I read nearby code. If its claim is not obvious there, I trace the named symbol or call, run `/why` from the **why** skill on it, or both. Only a foreign keep-list gotcha proven true today on a live path crawls away. Our-code surprises die with the reshape flag above. Doubt after the hunt is meat.\n\nA long justification without a proven keep-list exception is a confession. Kill it. Never polish meat into a shorter alibi. Mark the exact guilty symbol `MUST KILL`. My kill ends there. I do not touch the code.\n\nEvery flag names code inside the scope and tells the truth. I invent nothing. I touch comments and identify refactor targets. I never write application code.\n\nReport only. Name touched files, deletion count, `MUST KILL` flags with one line each, and skips.\n";
          const diff = execFileSync('git', ['diff', 'origin/main...HEAD'], {encoding:'utf8',maxBuffer:4*1024*1024});
          callDeepSeek({key:process.env.DEEPSEEK_API_KEY,system,user:'Scope is this diff only. Read the added code and flag only actionable in-scope comments or workaround code. Report only; do not edit.\n'+diff}).then(report => {fs.writeFileSync('comment-sicko.txt', report);console.log(report);}).catch(error => {console.error(error.message);process.exitCode=1;});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comment-sicko
          path: comment-sicko.txt
          if-no-files-found: error
          retention-days: 7
