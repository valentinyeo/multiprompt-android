name: pstack-verifier

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of an open pull request from this repository. Dispatch on that pull request's branch.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pstack-verifier-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pick:
    name: pick journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      no_product_change: ${{ steps.pick.outputs.no_product_change }}
      features: ${{ steps.pick.outputs.features }}
      smoke: ${{ steps.pick.outputs.smoke }}
      reason: ${{ steps.pick.outputs.reason }}
      number: ${{ steps.pick.outputs.number }}
      head_sha: ${{ steps.pick.outputs.head_sha }}
      merge_base: ${{ steps.pick.outputs.merge_base }}
      changed_outcomes: ${{ steps.pick.outputs.changed_outcomes }}
      change_kind: ${{ steps.pick.outputs.change_kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts
            .claude/skills/verify-multiprompt-android/features
            tools/pstack-verifier.test.js
            tools/pstack-verifier-eval.test.js
            tools/feature-coverage.test.js
            tools/branch-protection.mjs
            tools/branch-protection.test.js
            tools/pr-checks.mjs
            tools/pr-checks.test.js
            tools/fixtures/pr-checks
            tools/workflow-inputs.test.js
            tools/release-proof.test.js
            tools/release-proof.sh
            tools/release-choices/prepare.sh
            tools/fixtures/feature-coverage
            tools/release-notes/ticket-titles.json
            .claude/skills/verify-multiprompt-android/scripts/drive.sh
            .github/workflows
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Prove the verifier on real historical mistakes
        run: node --test tools/feature-coverage.test.js tools/pstack-verifier.test.js tools/pstack-verifier-eval.test.js tools/workflow-inputs.test.js tools/release-proof.test.js tools/pr-checks.test.js tools/branch-protection.test.js > "$RUNNER_TEMP/tooling-proof.txt" 2>&1
      - name: Retain non-UI verifier proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-tooling-proof
          path: ${{ runner.temp }}/tooling-proof.txt
          if-no-files-found: error
          retention-days: 7
      - name: Choose the journeys that exercise this change
        id: pick
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/pstack-verifier/verifier.cjs pick

  journeys:
    name: journey ${{ matrix.feature }}
    needs: pick
    if: needs.pick.outputs.no_product_change != 'true'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.pick.outputs.features) }}
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: read
    with:
      feature: ${{ matrix.feature }}
      side: head
      app_ref: ${{ needs.pick.outputs.head_sha }}

  parents:
    name: parent journey ${{ matrix.feature }}
    needs: pick
    if: needs.pick.outputs.no_product_change != 'true'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.pick.outputs.features) }}
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: read
    with:
      feature: ${{ matrix.feature }}
      side: parent
      app_ref: ${{ needs.pick.outputs.merge_base }}

  pstack-verifier:
    name: pstack-verifier
    needs: [pick, journeys, parents]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Report no product change
        if: needs.pick.result == 'success' && needs.pick.outputs.no_product_change == 'true'
        env:
          REASON: ${{ needs.pick.outputs.reason }}
        run: printf '%s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.pick.outputs.no_product_change != 'true'
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts
            .claude/skills/verify-multiprompt-android/features
            tools/release-notes/ticket-titles.json
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.pick.outputs.no_product_change != 'true'
        with:
          node-version: 22
      - name: Judge the change against the journey evidence
        if: needs.pick.outputs.no_product_change != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.pick.outputs.number }}
          HEAD_SHA: ${{ needs.pick.outputs.head_sha }}
          MERGE_BASE: ${{ needs.pick.outputs.merge_base }}
          FEATURES: ${{ needs.pick.outputs.features }}
          CHANGED_OUTCOMES: ${{ needs.pick.outputs.changed_outcomes }}
          CHANGE_KIND: ${{ needs.pick.outputs.change_kind }}
          COVERAGE_REPORT: ${{ runner.temp }}/feature-coverage.json
          SMOKE: ${{ needs.pick.outputs.smoke }}
          PICK_REASON: ${{ needs.pick.outputs.reason }}
          PICK_RESULT: ${{ needs.pick.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/pstack-verifier/verifier.cjs judge
      - name: Retain structured outcome coverage
        if: always() && needs.pick.outputs.no_product_change != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verifier-feature-coverage
          path: ${{ runner.temp }}/feature-coverage.json
          if-no-files-found: error
          retention-days: 7
