name: pstack-verifier

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of an open pull request from this repository. Dispatch on that pull request's branch.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pstack-verifier-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pick:
    name: pick journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      no_product_change: ${{ steps.pick-request.outputs.no_product_change }}
      features: ${{ steps.pick-retry.outputs.features || steps.pick.outputs.features || steps.pick-request.outputs.features }}
      runners: ${{ steps.pick-retry.outputs.runners || steps.pick.outputs.runners || steps.pick-request.outputs.runners }}
      smoke: ${{ steps.pick-retry.outputs.smoke || steps.pick.outputs.smoke || steps.pick-request.outputs.smoke }}
      reason: ${{ steps.pick-retry.outputs.reason || steps.pick.outputs.reason || steps.pick-request.outputs.reason }}
      number: ${{ steps.pick-retry.outputs.number || steps.pick.outputs.number || steps.pick-request.outputs.number }}
      head_sha: ${{ steps.pick-retry.outputs.head_sha || steps.pick.outputs.head_sha || steps.pick-request.outputs.head_sha }}
      merge_base: ${{ steps.pick-retry.outputs.merge_base || steps.pick.outputs.merge_base || steps.pick-request.outputs.merge_base }}
      changed_outcomes: ${{ steps.pick-retry.outputs.changed_outcomes || steps.pick.outputs.changed_outcomes || steps.pick-request.outputs.changed_outcomes }}
      change_kind: ${{ steps.pick-retry.outputs.change_kind || steps.pick.outputs.change_kind || steps.pick-request.outputs.change_kind }}
      speed: ${{ steps.pick-retry.outputs.speed || steps.pick.outputs.speed || steps.pick-request.outputs.speed }}
      visible: ${{ steps.pick-retry.outputs.visible || steps.pick.outputs.visible || steps.pick-request.outputs.visible }}
      unmapped: ${{ steps.pick-retry.outputs.unmapped || steps.pick.outputs.unmapped || steps.pick-request.outputs.unmapped }}
      coverage_recorded: ${{ steps.pick-retry.outputs.coverage_recorded || steps.pick.outputs.coverage_recorded || steps.pick-request.outputs.coverage_recorded }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github/scripts
            .claude/skills/verify-multiprompt-android/features
            tools/release-notes/titles
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Write journey picker request
        id: pick-request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PICK_REQUEST_FILE: ${{ runner.temp }}/pick-request.json
          PICK_STATE_FILE: ${{ runner.temp }}/pick-state.json
        run: node .github/scripts/pstack-verifier/verifier.cjs pick-request
      - name: Call Token Ladder for journey pick
        id: pick-ladder
        if: steps.pick-request.outputs.need_ladder == 'true'
        continue-on-error: true
        uses: valentinyeo/token-ladder/.github/actions/ladder-call@main
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          request-file: ${{ steps.pick-request.outputs.request-file }}
          purpose: pr-journey-picker
      - name: Choose the journeys that exercise this change
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PICK_STATE_FILE: ${{ steps.pick-request.outputs.state-file }}
          LADDER_ANSWER_FILE: ${{ steps.pick-ladder.outputs.answer-file }}
          LADDER_FAILED: ${{ steps.pick-ladder.outcome == 'failure' || steps.pick-ladder.outcome == 'skipped' }}
        run: node .github/scripts/pstack-verifier/verifier.cjs pick
      - name: Call Token Ladder for journey pick correction
        id: pick-ladder-retry
        if: steps.pick.outputs.need_retry == 'true'
        continue-on-error: true
        uses: valentinyeo/token-ladder/.github/actions/ladder-call@main
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          request-file: ${{ steps.pick.outputs.retry-request-file }}
          purpose: pr-journey-picker-retry
      - name: Finish journey pick after correction
        id: pick-retry
        if: steps.pick.outputs.need_retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PICK_STATE_FILE: ${{ steps.pick-request.outputs.state-file }}
          PICK_RETRY_ANSWER_FILE: ${{ steps.pick-ladder-retry.outputs.answer-file }}
          LADDER_FAILED: ${{ steps.pick-ladder-retry.outcome == 'failure' || steps.pick-ladder-retry.outcome == 'skipped' }}
        run: node .github/scripts/pstack-verifier/verifier.cjs pick


  journeys:
    name: journey ${{ matrix.feature }}
    needs: pick
    if: needs.pick.outputs.features != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.pick.outputs.features) }}
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: read
    with:
      feature: ${{ matrix.feature }}
      side: head
      driver_feature: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].feature }}
      candidate: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].candidate }}
      released_chat: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].released_chat }}
      released_robots: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].released_robots }}
      release_choices: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].release_choices }}
      pins_scroll: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].pins_scroll }}
      app_ref: ${{ needs.pick.outputs.head_sha }}
      record_video: ${{ needs.pick.outputs.visible == 'yes' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  parents:
    name: parent journey ${{ matrix.feature }}
    needs: pick
    if: needs.pick.outputs.visible == 'yes' && needs.pick.outputs.features != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.pick.outputs.features) }}
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: read
    with:
      feature: ${{ matrix.feature }}
      side: parent
      driver_feature: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].feature }}
      candidate: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].candidate }}
      released_chat: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].released_chat }}
      released_robots: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].released_robots }}
      release_choices: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].release_choices }}
      pins_scroll: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].pins_scroll }}
      app_ref: ${{ needs.pick.outputs.merge_base }}
      record_video: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  speed:
    name: chat list and inbox work
    needs: pick
    if: needs.pick.outputs.speed == 'yes'
    permissions:
      contents: read
    uses: ./.github/workflows/speed-check.yml
    with:
      base_sha: ${{ needs.pick.outputs.merge_base }}
      head_sha: ${{ needs.pick.outputs.head_sha }}

  pstack-verifier:
    name: pstack-verifier
    needs: [pick, journeys, parents, speed]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/scripts
            .claude/skills/verify-multiprompt-android/features
            tools/release-notes/titles
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Require successful verification preparation
        env:
          PICK_RESULT: ${{ needs.pick.result }}
        run: test "$PICK_RESULT" = success
      - name: Post verifier verdict from journey results
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.pick.outputs.number }}
          HEAD_SHA: ${{ needs.pick.outputs.head_sha }}
          MERGE_BASE: ${{ needs.pick.outputs.merge_base }}
          FEATURES: ${{ needs.pick.outputs.features }}
          CHANGED_OUTCOMES: ${{ needs.pick.outputs.changed_outcomes }}
          UNMAPPED: ${{ needs.pick.outputs.unmapped }}
          COVERAGE_RECORDED: ${{ needs.pick.outputs.coverage_recorded }}
          CHANGE_KIND: ${{ needs.pick.outputs.change_kind }}
          COVERAGE_REPORT: ${{ runner.temp }}/feature-coverage.json
          SMOKE: ${{ needs.pick.outputs.smoke }}
          SPEED_REQUIRED: ${{ needs.pick.outputs.speed }}
          SPEED_RESULT: ${{ needs.speed.result }}
          VISIBLE: ${{ needs.pick.outputs.visible }}
          PICK_REASON: ${{ needs.pick.outputs.reason }}
          PICK_RESULT: ${{ needs.pick.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/pstack-verifier/verifier.cjs judge
      - name: Retain structured outcome coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: verifier-feature-coverage
          path: ${{ runner.temp }}/feature-coverage.json
          if-no-files-found: error
          retention-days: 7
