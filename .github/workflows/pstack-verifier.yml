name: pstack-verifier

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of an open pull request from this repository. Dispatch on that pull request's branch.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pstack-verifier-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pick:
    name: pick journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      no_product_change: ${{ steps.pick.outputs.no_product_change }}
      features: ${{ steps.pick.outputs.features }}
      runners: ${{ steps.pick.outputs.runners }}
      smoke: ${{ steps.pick.outputs.smoke }}
      reason: ${{ steps.pick.outputs.reason }}
      number: ${{ steps.pick.outputs.number }}
      head_sha: ${{ steps.pick.outputs.head_sha }}
      merge_base: ${{ steps.pick.outputs.merge_base }}
      changed_outcomes: ${{ steps.pick.outputs.changed_outcomes }}
      change_kind: ${{ steps.pick.outputs.change_kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github/scripts
            .claude/skills/verify-multiprompt-android/features
            tools/release-notes/titles
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Choose the journeys that exercise this change
        id: pick
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/pstack-verifier/verifier.cjs pick


  journeys:
    name: journey ${{ matrix.feature }}
    needs: pick
    if: needs.pick.outputs.features != '[]'
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.pick.outputs.features) }}
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: read
    with:
      feature: ${{ matrix.feature }}
      side: head
      driver_feature: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].feature }}
      candidate: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].candidate }}
      released_chat: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].released_chat }}
      released_robots: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].released_robots }}
      release_choices: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].release_choices }}
      pins_scroll: ${{ fromJSON(needs.pick.outputs.runners)[matrix.feature].pins_scroll }}
      app_ref: ${{ needs.pick.outputs.head_sha }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  pstack-verifier:
    name: pstack-verifier
    needs: [pick, journeys]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/scripts
            .claude/skills/verify-multiprompt-android/features
            tools/release-notes/titles
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Require successful verification preparation
        env:
          PICK_RESULT: ${{ needs.pick.result }}
        run: test "$PICK_RESULT" = success
      - name: Install Claude Code for changes DeepSeek wrote
        run: npm i -g @anthropic-ai/claude-code@2.1.326
      - name: Judge the change against the journey evidence
        id: judge
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.pick.outputs.number }}
          HEAD_SHA: ${{ needs.pick.outputs.head_sha }}
          MERGE_BASE: ${{ needs.pick.outputs.merge_base }}
          FEATURES: ${{ needs.pick.outputs.features }}
          CHANGED_OUTCOMES: ${{ needs.pick.outputs.changed_outcomes }}
          CHANGE_KIND: ${{ needs.pick.outputs.change_kind }}
          COVERAGE_REPORT: ${{ runner.temp }}/feature-coverage.json
          SMOKE: ${{ needs.pick.outputs.smoke }}
          PICK_REASON: ${{ needs.pick.outputs.reason }}
          PICK_RESULT: ${{ needs.pick.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/pstack-verifier/verifier.cjs judge
      - name: Retain structured outcome coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: verifier-feature-coverage
          path: ${{ runner.temp }}/feature-coverage.json
          if-no-files-found: error
          retention-days: 7
