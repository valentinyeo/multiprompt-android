name: Verify real Android UI

on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
    inputs:
      driver_feature:
        description: Driver recipe when the registered journey uses another recipe with dedicated inputs
        type: string
        required: false
      released_chat:
        required: false
        type: boolean
        default: false
      released_robots:
        required: false
        type: boolean
        default: false
      release_choices:
        required: false
        type: boolean
        default: false
      pins_scroll:
        required: false
        type: boolean
        default: false
      candidate:
        required: false
        type: boolean
        default: false
      break_it:
        description: Replay a proven head journey with five retained stress checkpoints
        type: boolean
        default: false
      feature:
        description: User journey from the verification feature map
        required: true
        type: string
      side:
        description: Which side of a pull request this run drives, head or parent
        required: false
        type: string
      app_ref:
        description: Optional pinned app source, the merge base for the parent side
        required: false
        type: string
      agent_review:
        description: After the scripted journey, run an independent agent verifier on this feature
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      break_it:
        description: Replay after normal proof with rotation, background, chat switch, slow network and streaming send
        type: boolean
        default: false
      break_it_control:
        description: Plant rotation draft loss in the complete PR 408 source checkout
        type: choice
        default: none
        options:
          - none
          - rotation-loss
      released_terminal:
        description: Verify 500-line shell scrolling on the published signed APK
        type: boolean
        default: false
      release_icon:
        description: Verify the approved launcher icon on the published signed APK
        type: boolean
        default: false
      release_choices:
        description: Verify plain lists and real question answers on the signed release APK
        type: boolean
        default: false
      released_chat:
        description: Verify chat catchup on the signed published APK
        type: boolean
        default: false
      pins_scroll:
        description: Verify pinned sessions scroll with the list on the signed APK
        type: boolean
        default: false
      released_robots:
        description: Verify robot inbox and chat title on the signed APK
        type: boolean
        default: false
      released_reactions:
        description: Verify reaction display and transport on the signed APK
        type: boolean
        default: false
      candidate:
        description: Build signed branch candidate instead of downloading the published APK
        type: boolean
        default: false
      channel:
        description: Signed recovery release channel
        type: choice
        default: android-latest
        options:
          - android-latest
          - android-m3-latest
      expected_commit:
        description: Required published manifest commit for release choices proof
        type: string
      feature:
        description: User journey from the verification feature map
        required: true
        type: choice
        options:
          - ai-switch.md
          - chat-cancel.md
          - chat-choices.md
          - chat-codex.md
          - chat-queued.md
          - chat-reactions.md
          - chat-resync.md
          - chat-shared.md
          - copy-chat-id.md
          - host-changed-key.md
          - hosts-retired.md
          - hosts.md
          - launcher-icon.md
          - native-skills.md
          - robot-faces.md
          - session-drafts.md
          - session-favorite-dot.md
          - session-favorites.md
          - session-gestures.md
          - session-reader.md
          - session-routing.md
          - session-stop.md
          - session-summaries.md
          - sessions.md
          - settings-navigation.md
          - sign-in.md
          - terminal.md
          - chat-identity.md
          - device-approval.md
          - chat-search.md
          - snippets.md
          - claude-remote-control.md
          - ai-usage.md
          - skill-pills.md
          - chat-table.md
          - clear-ranking.md
          - signed-out-sync.md
          - bot-look.md
          - reader-version.md
          - reader-controls.md
          - message-reply.md
          - settings-controls.md
          - inbox-reminders.md
          - screencast-account.md
          - host-restart.md
          - folder-bar.md
          - chat-shapes.md
          - crash-report.md
      expect_settings_missing:
        description: Require signed Android 301 to reject the settings navigation journey
        type: boolean
        default: false
      expect_shell_missing:
        description: Require the original app to reject upward shell scrolling
        type: boolean
        default: false
      expect_native_missing:
        description: Require the original app to reject the native slash journey
        required: false
        type: boolean
        default: false
      expect_shared_missing:
        description: Require Android 303 to fail the shared host-state journey
        type: boolean
        default: false
      app_ref:
        description: Optional pinned app source for the unchanged journey negative control or published source
        required: false
        type: string
      update_baseline_run:
        description: Earlier reactions workflow run holding the signed update baseline
        required: false
        type: string
      agent_review:
        description: After the scripted journey, run an independent agent verifier on this feature
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-${{ github.ref }}${{ inputs.feature && inputs.feature != github.event.inputs.feature && format('-{0}', inputs.feature) || '' }}${{ inputs.side && format('-{0}', inputs.side) || '' }}-${{ inputs.break_it_control || 'none' }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ inputs.expect_shell_missing && 'original shell control' || inputs.expect_native_missing && 'original native-skill control' || 'verify' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.feature == 'reader-controls.md' && 50 || inputs.side == 'parent' && 50 || inputs.break_it && 55 || 35 }}
    env:
      EVIDENCE: ${{ github.workspace }}/verification-evidence
      VERIFY_FEATURE: ${{ inputs.driver_feature || inputs.feature || 'native-skills.md' }}
      VERIFY_JOURNEY: ${{ inputs.feature || 'native-skills.md' }}
      EXPECTED_VERSION: 0.1.2-verify.${{ github.run_number }}-debug
      UPDATE_BASELINE_RUN: ${{ inputs.update_baseline_run }}
      APP_REF: ${{ inputs.app_ref }}
      BREAK_IT: ${{ inputs.break_it }}
      BREAK_IT_CONTROL: ${{ inputs.break_it_control }}
      VERIFY_SIDE: ${{ inputs.side }}
      EXPECT_SHARED_MISSING: ${{ inputs.expect_shared_missing }}
      RELEASE_CHANNEL: ${{ inputs.channel || 'android-latest' }}
      PIN_SCROLL_PROOF: ${{ inputs.pins_scroll }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: ${{ inputs.side == 'parent' }}
      - name: Reuse a recorded base result for this source and harness
        id: parent-cache
        if: inputs.side == 'parent'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/pstack-verifier/parent-cache.cjs restore
      - name: Validate signed recovery channel
        if: steps.parent-cache.outputs.hit != 'true'
        id: validate-channel
        continue-on-error: ${{ inputs.side == 'parent' }}
        env:
          SIDE: ${{ inputs.side }}
          RELEASED_CHAT: ${{ inputs.released_chat }}
          CANDIDATE: ${{ inputs.candidate }}
          EXPECT_SHELL_MISSING: ${{ inputs.expect_shell_missing }}
          EXPECT_NATIVE_MISSING: ${{ inputs.expect_native_missing }}
          EXPECT_SETTINGS_MISSING: ${{ inputs.expect_settings_missing }}
          RELEASE_CHOICES: ${{ inputs.release_choices }}
          RELEASE_ICON: ${{ inputs.release_icon }}
          RELEASED_REACTIONS: ${{ inputs.released_reactions }}
          RELEASED_TERMINAL: ${{ inputs.released_terminal }}
          RELEASED_ROBOTS: ${{ inputs.released_robots }}
        run: |
          if [[ "$BREAK_IT" == true ]]; then
            [[ "$SIDE" != parent ]]
            [[ "$RELEASED_CHAT" != true && "$RELEASE_CHOICES" != true && "$RELEASE_ICON" != true && "$RELEASED_REACTIONS" != true && "$RELEASED_TERMINAL" != true && "$RELEASED_ROBOTS" != true || "$CANDIDATE" == true ]]
          fi
          if [[ "$BREAK_IT_CONTROL" != none && -n "$BREAK_IT_CONTROL" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$BREAK_IT" == true && "$BREAK_IT_CONTROL" == rotation-loss && "$VERIFY_FEATURE" == ai-switch.md && "$APP_REF" == 75c43b90864ef8479ba1dda52a1f04d4d0e3d968 ]]
          fi
          if [[ "$SIDE" == parent ]]; then
            [[ "$APP_REF" =~ ^[0-9a-f]{40}$ ]]
          fi
          if [[ "$PIN_SCROLL_PROOF" == true ]]; then
            [[ "$VERIFY_FEATURE" == session-favorites.md && "$RELEASED_CHAT" == true && ( -z "$APP_REF" || "$CANDIDATE" == true ) && -z "$UPDATE_BASELINE_RUN" ]]
            [[ "$RELEASE_CHOICES" != true && "$RELEASE_ICON" != true && "$RELEASED_REACTIONS" != true && "$RELEASED_TERMINAL" != true && "$RELEASED_ROBOTS" != true ]]
            [[ "$EXPECT_SHARED_MISSING" != true && "$EXPECT_SHELL_MISSING" != true && "$EXPECT_NATIVE_MISSING" != true && "$EXPECT_SETTINGS_MISSING" != true ]]
          fi
          if [[ "$EXPECT_SHARED_MISSING" == true ]]; then
            [[ "$VERIFY_FEATURE" == chat-shared.md && "$APP_REF" == 9198aad3721905b09931cdd85628988fe0bd3292 && "$RELEASE_CHANNEL" == android-latest && -z "$UPDATE_BASELINE_RUN" ]]
            [[ "$CANDIDATE" != true && "$RELEASED_CHAT" != true && "$RELEASE_CHOICES" != true && "$RELEASE_ICON" != true && "$RELEASED_REACTIONS" != true && "$RELEASED_TERMINAL" != true && "$RELEASED_ROBOTS" != true && "$EXPECT_SHELL_MISSING" != true && "$EXPECT_NATIVE_MISSING" != true && "$EXPECT_SETTINGS_MISSING" != true ]]
          fi
          if [[ "$VERIFY_FEATURE" == session-routing.md ]]; then
            [[ "$RELEASE_CHOICES" != true && "$RELEASE_ICON" != true && "$RELEASED_REACTIONS" != true && "$RELEASED_TERMINAL" != true && "$RELEASED_ROBOTS" != true ]]
            [[ "$EXPECT_SHELL_MISSING" != true && "$EXPECT_NATIVE_MISSING" != true ]]
            if [[ "$CANDIDATE" == true ]]; then [[ "$RELEASED_CHAT" == true ]]; fi
          fi
          if [[ "$VERIFY_FEATURE" == session-favorites.md || ( "$VERIFY_FEATURE" == session-routing.md && ( "$RELEASED_CHAT" == true || "$RELEASE_CHANNEL" == android-m3-latest ) ) ]]; then
            [[ "$RELEASED_CHAT" == true && ( -z "$APP_REF" || "$CANDIDATE" == true ) && -z "$UPDATE_BASELINE_RUN" ]]
            [[ "$RELEASE_CHOICES" != true && "$RELEASE_ICON" != true && "$RELEASED_REACTIONS" != true && "$RELEASED_TERMINAL" != true && "$RELEASED_ROBOTS" != true ]]
          fi
          case "$RELEASE_CHANNEL" in
            android-latest) ;;
            android-m3-latest)
              if [[ "$VERIFY_FEATURE" == settings-navigation.md ]]; then
                [[ "$RELEASE_CHOICES" == true && "$RELEASED_CHAT" != true && -z "$APP_REF" && -z "$UPDATE_BASELINE_RUN" ]]
                [[ "$RELEASE_ICON" != true && "$RELEASED_REACTIONS" != true && "$RELEASED_TERMINAL" != true && "$RELEASED_ROBOTS" != true && "$EXPECT_SHELL_MISSING" != true && "$EXPECT_NATIVE_MISSING" != true ]]
              else
                [[ ( "$VERIFY_FEATURE" == chat-resync.md || "$VERIFY_FEATURE" == chat-shared.md || "$VERIFY_FEATURE" == session-favorites.md || "$VERIFY_FEATURE" == chat-queued.md || "$VERIFY_FEATURE" == session-routing.md ) && "$RELEASED_CHAT" == true && -z "$APP_REF" && -z "$UPDATE_BASELINE_RUN" ]]
                [[ "$RELEASE_CHOICES" != true && "$RELEASE_ICON" != true && "$RELEASED_REACTIONS" != true && "$RELEASED_TERMINAL" != true && "$RELEASED_ROBOTS" != true ]]
              fi
              ;;
            *) exit 1 ;;
          esac
      - name: Prove SSH fixture configuration on the supported host
        if: steps.parent-cache.outputs.hit != 'true'
        id: ssh-proof
        continue-on-error: ${{ inputs.side == 'parent' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          sudo install -d -m 755 /run/sshd
          if [ "$GITHUB_REF" = refs/heads/ceo/IGSH-1022 ]; then
            git fetch --depth=1 origin 6c808de1454493a16598e469ed38ec4dad15a4ab
            git show 6c808de1454493a16598e469ed38ec4dad15a4ab:.claude/skills/verify-multiprompt-android/scripts/fixture.sh > "$RUNNER_TEMP/original-fixture.sh"
            if FIXTURE_SOURCE="$RUNNER_TEMP/original-fixture.sh" node --test tools/fixture.test.js > "$RUNNER_TEMP/fixture-red.txt" 2>&1; then
              cat "$RUNNER_TEMP/fixture-red.txt"
              exit 1
            fi
            cat "$RUNNER_TEMP/fixture-red.txt"
            grep -F 'Bad configuration option: PerSourcePenalties' "$RUNNER_TEMP/fixture-red.txt"
          fi
          node --test tools/fixture.test.js
          printf 'SSH_FIXTURE_RED_GREEN_OK\n'
      - name: Prepare verification paths
        if: steps.parent-cache.outputs.hit != 'true'
        id: prepare-paths
        continue-on-error: ${{ inputs.side == 'parent' }}
        run: |
          mkdir -p "$EVIDENCE"
          echo "FIXTURE=$RUNNER_TEMP/verify-ssh" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        if: steps.parent-cache.outputs.hit != 'true'
        id: setup-java
        continue-on-error: ${{ inputs.side == 'parent' }}
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.parent-cache.outputs.hit != 'true'
        id: setup-gradle
        continue-on-error: ${{ inputs.side == 'parent' }}
        with:
          gradle-version: "9.5.1"
      - uses: android-actions/setup-android@v3
        if: steps.parent-cache.outputs.hit != 'true'
        id: setup-android
        continue-on-error: ${{ inputs.side == 'parent' }}
        with:
          packages: platform-tools
      - uses: actions/checkout@v4
        id: app-checkout
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (env.APP_REF != '') && steps.parent-cache.outputs.hit != 'true'
        with:
          ref: ${{ env.APP_REF }}
          path: app-source
      - name: Capture signed update baseline
        id: update-baseline-capture
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (env.VERIFY_FEATURE == 'chat-reactions.md' && inputs.update_baseline_run == '') && steps.parent-cache.outputs.hit != 'true'
        run: |
          mkdir -p "$EVIDENCE/signed-update-baseline"
          curl -fsSL https://github.com/valentinyeo/multiprompt-android/releases/download/android-latest/multiprompt-companion-update.json -o "$EVIDENCE/signed-update-baseline/manifest.json"
          curl -fsSL "$(jq -er '.apkUrl' "$EVIDENCE/signed-update-baseline/manifest.json")" -o "$EVIDENCE/signed-update-baseline/app.apk"
          printf '%s  %s\n' "$(jq -er '.sha256' "$EVIDENCE/signed-update-baseline/manifest.json")" "$EVIDENCE/signed-update-baseline/app.apk" | sha256sum --check
      - name: Restore signed update baseline
        id: update-baseline-restore
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (inputs.update_baseline_run != '') && steps.parent-cache.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.update_baseline_run }}
        run: |
          [[ "$BASELINE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name "verify-chat-reactions.md-$BASELINE_RUN" --dir "$RUNNER_TEMP/update-baseline"
          cp -a "$RUNNER_TEMP/update-baseline/signed-update-baseline" "$EVIDENCE/"
      - name: Check reaction screenshot oracle
        if: steps.parent-cache.outputs.hit != 'true'
        id: reaction-oracle
        continue-on-error: ${{ inputs.side == 'parent' }}
        run: |
          python3 -m pip install Pillow
          python3 .claude/skills/verify-multiprompt-android/scripts/reactions.test.py
      - name: Check chat search screenshot assertions
        id: chat-search-oracle
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (env.VERIFY_FEATURE == 'chat-search.md') && steps.parent-cache.outputs.hit != 'true'
        run: python3 -B tools/chat-search/ui.test.py
      - name: Check chat table assertions
        id: chat-table-oracle
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (env.VERIFY_FEATURE == 'chat-table.md') && steps.parent-cache.outputs.hit != 'true'
        run: python3 -B tools/chat-table/ui.test.py
      - name: Check reader control screenshot assertions
        id: reader-control-oracle
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (env.VERIFY_FEATURE == 'reader-controls.md') && steps.parent-cache.outputs.hit != 'true'
        run: python3 -B tools/control-journeys/ui.test.py
      - name: Check AI usage assertions
        id: ai-usage-oracle
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (env.VERIFY_FEATURE == 'ai-usage.md') && steps.parent-cache.outputs.hit != 'true'
        run: python3 -B tools/ai-usage/ui.test.py
      - name: Check skill pill screenshot assertions
        id: skill-pills-oracle
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (env.VERIFY_FEATURE == 'skill-pills.md') && steps.parent-cache.outputs.hit != 'true'
        run: |
          python3 -B tools/skill-pills/ui.test.py
          python3 -B tools/skill-pills/console.test.py
      - name: Check terminal input oracle and selectors
        id: terminal-input-oracle
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (env.VERIFY_FEATURE == 'terminal.md') && steps.parent-cache.outputs.hit != 'true'
        run: python3 -B tools/terminal-console.test.py
      - name: Check recovery UI oracle
        id: recovery-oracle
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (env.VERIFY_FEATURE == 'chat-resync.md') && steps.parent-cache.outputs.hit != 'true'
        run: python3 -B tools/release-choices/ui.test.py
      - name: Reject code scroll interception on original source
        id: gesture-reject
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (inputs.feature == 'session-gestures.md') && steps.parent-cache.outputs.hit != 'true'
        run: |
          python3 -B tools/session-gestures/scroll.test.py
          source=app/src/main/java/dev/multiprompt/companion/ui/ReplyableBubble.kt
          cp "$source" "$RUNNER_TEMP/ReplyableBubble.kt"
          git fetch origin f1e4e3ea3d25d48e4559337434a37f2f605609f7
          git show f1e4e3ea3d25d48e4559337434a37f2f605609f7:"$source" > "$source"
          status=0
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g testDebugUnitTest --tests '*ReplyToMessageTest.codeScrollsBothWaysWithoutStartingReply' || status=$?
          cp "$RUNNER_TEMP/ReplyableBubble.kt" "$source"
          test "$status" -ne 0
          python3 - <<'PYCONTROL'
          import xml.etree.ElementTree as ET
          root = ET.parse('app/build/test-results/testDebugUnitTest/TEST-dev.multiprompt.companion.ui.ReplyToMessageTest.xml').getroot()
          case = root.find("testcase[@name='codeScrollsBothWaysWithoutStartingReply']")
          failure = case.find('failure')
          assert failure is not None and 'Wide code must scroll back right' in failure.get('message', '')
          print('ORIGINAL_CODE_SCROLL_INTERCEPTION_REJECTED')
          PYCONTROL
          cp app/build/test-results/testDebugUnitTest/TEST-dev.multiprompt.companion.ui.ReplyToMessageTest.xml "$EVIDENCE/original-gesture.xml"
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g testDebugUnitTest --tests '*ReplyToMessageTest' --tests '*ShellViewTest'
      - name: Prepare signed choices APK and same-signer fixture instrumentation
        id: signed-apk
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (inputs.release_choices == true || inputs.released_reactions == true || inputs.released_terminal == true || inputs.released_robots == true || inputs.released_chat == true) && steps.parent-cache.outputs.hit != 'true'
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [[ "$VERIFY_FEATURE" = settings-navigation.md || "$VERIFY_FEATURE" = chat-queued.md || "$VERIFY_FEATURE" = chat-choices.md || "$VERIFY_FEATURE" = chat-reactions.md || "$VERIFY_FEATURE" = terminal.md || "$VERIFY_FEATURE" = robot-faces.md || "$VERIFY_FEATURE" = chat-cancel.md || "$VERIFY_FEATURE" = session-gestures.md || "$VERIFY_FEATURE" = session-summaries.md || "$VERIFY_FEATURE" = chat-resync.md || "$VERIFY_FEATURE" = chat-shared.md || "$VERIFY_FEATURE" = session-favorites.md || "$VERIFY_FEATURE" = session-routing.md ]]
          sdkmanager --install 'build-tools;35.0.0' 'platforms;android-35'
          bash tools/release-choices/prepare.sh
          echo "VERIFY_APK=$EVIDENCE/app.apk" >> "$GITHUB_ENV"
          echo "VERIFY_PACKAGE=$(cat "$EVIDENCE/package-name.txt")" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION=$(cat "$EVIDENCE/version.txt")" >> "$GITHUB_ENV"
      - name: Download published icon APK
        id: icon-apk
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (inputs.release_icon == true) && steps.parent-cache.outputs.hit != 'true'
        run: |
          test "$VERIFY_FEATURE" = launcher-icon.md
          python3 -m pip install Pillow
          python3 .claude/skills/verify-multiprompt-android/scripts/launcher-icon.test.py
          curl -fsSL https://github.com/valentinyeo/multiprompt-android/releases/download/android-latest/multiprompt-companion-update.json -o "$EVIDENCE/manifest.json"
          curl -fsSL "$(jq -er '.apkUrl' "$EVIDENCE/manifest.json")" -o "$EVIDENCE/app.apk"
          printf '%s  %s\n' "$(jq -er '.sha256' "$EVIDENCE/manifest.json")" "$EVIDENCE/app.apk" | sha256sum --check
          echo "VERIFY_APK=$EVIDENCE/app.apk" >> "$GITHUB_ENV"
          echo "VERIFY_PACKAGE=dev.multiprompt.companion" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION=$(jq -er '.versionName' "$EVIDENCE/manifest.json")" >> "$GITHUB_ENV"
      - name: Reject original Codex reader
        id: codex-reject
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (inputs.feature == 'chat-codex.md') && steps.parent-cache.outputs.hit != 'true'
        run: |
          git fetch origin 099a8e73b6857ff901d1166854dbbda0884122f1
          git show 099a8e73b6857ff901d1166854dbbda0884122f1:app/src/main/assets/chat_history_reader.py > "$RUNNER_TEMP/original-reader.py"
          if CODEX_READER="$RUNNER_TEMP/original-reader.py" python3 -B tools/codex-sync.test.py > "$EVIDENCE/codex-original.txt" 2>&1; then
            cat "$EVIDENCE/codex-original.txt"
            exit 1
          fi
          grep -F 'AssertionError' "$EVIDENCE/codex-original.txt"
          python3 -B tools/codex-sync.test.py 2>&1 | tee "$EVIDENCE/codex-fixed.txt"
          echo ORIGINAL_CODEX_REJECTED
      - name: Build debug APK
        id: build-apk
        timeout-minutes: ${{ inputs.side == 'parent' && 15 || 35 }}
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (inputs.release_choices != true && inputs.release_icon != true && inputs.released_reactions != true && inputs.released_terminal != true && inputs.released_robots != true && inputs.released_chat != true) && steps.parent-cache.outputs.hit != 'true'
        run: |
          mkdir -p "$EVIDENCE"
          python3 .claude/skills/verify-multiprompt-android/scripts/launcher-icon.test.py
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE/revision.txt"
          app_source="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/app-source" ]; then app_source="$GITHUB_WORKSPACE/app-source"; fi
          git -C "$app_source" rev-parse HEAD > "$EVIDENCE/app-source-sha.txt"
          if [[ "$BREAK_IT_CONTROL" == rotation-loss ]]; then python3 tools/android-break-it/plant.py "$app_source" "$EVIDENCE"; fi
          account_args=()
          if [[ "$VERIFY_FEATURE" == device-approval.md || "$VERIFY_FEATURE" == screencast-account.md || "$VERIFY_FEATURE" == crash-report.md ]]; then account_args=(-PaccountOrigin=http://10.0.2.2:8787); fi
          gradle -p "$app_source" --no-daemon -Dorg.gradle.jvmargs=-Xmx3g -PversionName="0.1.2-verify.$GITHUB_RUN_NUMBER" "${account_args[@]}" assembleDebug 2>&1 | tee "$EVIDENCE/build.txt"
          echo "VERIFY_APK=$app_source/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          sha256sum "$app_source/app/build/outputs/apk/debug/app-debug.apk" > "$EVIDENCE/app-apk-sha256.txt"
      - name: Build fixture instrumentation
        id: build-instrumentation
        timeout-minutes: ${{ inputs.side == 'parent' && 15 || 35 }}
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (inputs.released_chat != true && inputs.release_choices != true && inputs.release_icon != true && inputs.released_reactions != true && inputs.released_terminal != true && inputs.released_robots != true) && steps.parent-cache.outputs.hit != 'true'
        run: |
          account_args=()
          if [[ "$VERIFY_FEATURE" == device-approval.md || "$VERIFY_FEATURE" == screencast-account.md || "$VERIFY_FEATURE" == crash-report.md ]]; then account_args=(-PaccountOrigin=http://10.0.2.2:8787); fi
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g -PversionName="0.1.2-verify.$GITHUB_RUN_NUMBER" "${account_args[@]}" assembleDebugAndroidTest
      - name: Prepare shell and chat recording
        id: recording-tools
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (env.VERIFY_FEATURE == 'chat-queued.md') && steps.parent-cache.outputs.hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
          ffmpeg -version
      - name: Read the seeded chat shapes with the reader from before PR 425
        id: chat-shapes-reader
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (env.VERIFY_JOURNEY == 'chat-shapes.md') && steps.parent-cache.outputs.hit != 'true'
        run: |
          mkdir -p "$EVIDENCE"
          curl -fsSL --retry 3 --retry-all-errors https://raw.githubusercontent.com/valentinyeo/multiprompt-android/af4d369923a28d27890d81fcb3335c181583f05d/app/src/main/assets/chat_history_reader.py -o "$RUNNER_TEMP/pre-425-reader.py"
          test -s "$RUNNER_TEMP/pre-425-reader.py"
          app_source="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/app-source" ]; then app_source="$GITHUB_WORKSPACE/app-source"; fi
          python3 -B tools/chat-shapes/repro.py --pre-fix-reader "$RUNNER_TEMP/pre-425-reader.py" --current-reader "$app_source/app/src/main/assets/chat_history_reader.py" --evidence "$EVIDENCE/pre-425-reader.txt"
      - name: Start ephemeral public-key-only SSH and tmux
        if: steps.parent-cache.outputs.hit != 'true'
        id: ssh-fixture
        continue-on-error: ${{ inputs.side == 'parent' }}
        run: .claude/skills/verify-multiprompt-android/scripts/fixture.sh
      - name: Install, doctor and drive the real app
        if: steps.parent-cache.outputs.hit != 'true'
        id: native-ui
        timeout-minutes: ${{ inputs.feature == 'reader-controls.md' && 40 || inputs.side == 'parent' && 20 || inputs.break_it && 55 || 35 }}
        continue-on-error: ${{ inputs.side == 'parent' || github.event_name == 'workflow_dispatch' && (github.event.inputs.expect_native_missing == 'true' || github.event.inputs.expect_shell_missing == 'true' || github.event.inputs.expect_settings_missing == 'true' || github.event.inputs.expect_shared_missing == 'true') }}
        uses: ./.github/actions/android-proof
        with:
          stage: stage-1${{ inputs.side && format('-{0}-{1}', inputs.side, inputs.feature) || '' }}
          target: default
          script: |
            proof() {
              adb install -r -g "$VERIFY_APK"
              if [[ "${VERIFY_PACKAGE:-}" == dev.multiprompt.companion || "${VERIFY_PACKAGE:-}" == dev.multiprompt.companion.m3 ]]; then
                if [ "$VERIFY_FEATURE" = launcher-icon.md ]; then .claude/skills/verify-multiprompt-android/scripts/drive.sh "$VERIFY_FEATURE"; else bash tools/release-choices/run.sh; fi
              else
                adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
                .claude/skills/verify-multiprompt-android/scripts/drive.sh "$VERIFY_FEATURE"
              fi
              if [[ "$BREAK_IT" == true ]]; then
                printf 'NORMAL_JOURNEY_PASSED; starting break-it replay on the same emulator\n' | tee "$EVIDENCE/normal-journey-passed.txt"
                timeout --signal=TERM --kill-after=30s 1200s bash tools/android-break-it/run.sh
              fi
              if [ -n "$UPDATE_BASELINE_RUN" ]; then .claude/skills/verify-multiprompt-android/scripts/update-reaction-release.sh; fi
            }
            if [ "${VERIFY_SIDE:-}" = parent ]; then
              set +e
              (set -euo pipefail; proof)
              code=$?
              set -e
              mkdir -p "$EVIDENCE"
              printf '%s\n' "$code" > "$EVIDENCE/parent-driver-exit.txt"
            else
              proof
            fi
      - name: Install Claude Code for the agent reviewer
        id: agent-review-cli
        if: always() && (inputs.agent_review == true) && steps.parent-cache.outputs.hit != 'true' && steps.native-ui.conclusion != 'skipped'
        continue-on-error: ${{ inputs.side == 'parent' }}
        run: npm i -g @anthropic-ai/claude-code@2.1.326
      - name: Collect change context for the agent reviewer
        id: agent-review-context
        if: always() && (inputs.agent_review == true) && steps.parent-cache.outputs.hit != 'true' && steps.native-ui.conclusion != 'skipped'
        continue-on-error: ${{ inputs.side == 'parent' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$EVIDENCE/agent-review"
          git log -1 --format=%s > "$EVIDENCE/agent-review/title.txt"
          git log -1 --format=%b > "$EVIDENCE/agent-review/body.txt"
          git fetch --no-tags --depth=200 origin main
          if git diff --quiet origin/main...HEAD 2>/dev/null; then
            printf '(empty)\n' > "$EVIDENCE/agent-review/diff.txt"
          else
            git diff origin/main...HEAD > "$EVIDENCE/agent-review/diff.txt" || printf '(empty)\n' > "$EVIDENCE/agent-review/diff.txt"
          fi
      - name: Independent agent review on the live emulator
        id: agent-review
        if: always() && (inputs.agent_review == true) && steps.parent-cache.outputs.hit != 'true' && steps.native-ui.conclusion != 'skipped'
        continue-on-error: ${{ inputs.side == 'parent' }}
        timeout-minutes: 45
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node .github/scripts/pstack-verifier/agent-review.cjs
      - name: Retain agent review verdict
        if: always() && (inputs.agent_review == true) && steps.parent-cache.outputs.hit != 'true'
        continue-on-error: ${{ inputs.side == 'parent' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: agent-review-${{ env.VERIFY_JOURNEY }}-${{ github.run_id }}
          path: |
            verification-evidence/agent-review/**
          if-no-files-found: warn
          retention-days: 7
      - name: Compare desktop and Android transcript posts
        id: codex-parity
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (inputs.feature == 'chat-codex.md') && steps.parent-cache.outputs.hit != 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/valentinyeo/multiprompt/93ff8a0631761eefaf772b58ccb7a6318c7edc02/src/chat_history_reader.py -o /tmp/desktop-codex-reader.py
          install -m 644 .claude/skills/verify-multiprompt-android/scripts/codex-parity.py /tmp/codex-parity.py
          install -m 644 app/src/main/assets/chat_history_reader.py /tmp/android-codex-reader.py
          sudo -u verifyssh python3 -B /tmp/codex-parity.py /tmp/desktop-codex-reader.py /tmp/android-codex-reader.py > "$EVIDENCE/desktop-android-parity.txt"
          cat "$EVIDENCE/desktop-android-parity.txt"
          grep -Fx DESKTOP_ANDROID_POSTS_IDENTICAL "$EVIDENCE/desktop-android-parity.txt"
      - name: Require the Android 301 settings failure
        id: require-settings
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.expect_settings_missing == 'true') && steps.parent-cache.outputs.hit != 'true'
        env:
          EMULATOR_OUTCOME: ${{ steps.native-ui.outcome }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_CHOICES: ${{ inputs.release_choices }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          test "$VERIFY_FEATURE" = settings-navigation.md
          test "$RELEASE_CHOICES" = true
          test "$CANDIDATE" != true
          test "$EXPECTED_COMMIT" = 0d255e99f15656bca388feb4558399139e363e88
          test "$(cat "$EVIDENCE/app-source-sha.txt")" = "$EXPECTED_COMMIT"
          test "$EMULATOR_OUTCOME" = failure
          grep -Ex 'SETTINGS_NAVIGATION_RETIRED_DESTINATION|SETTINGS_NAVIGATION_MISSING_HOST_MAPPING' "$EVIDENCE/settings-baseline.txt"
          printf 'ANDROID_301_SETTINGS_REJECTED\n' > "$EVIDENCE/settings-baseline-result.txt"
      - name: Require Android 303 shared host-state failure
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (always() && github.event_name == 'workflow_dispatch' && github.event.inputs.expect_shared_missing == 'true') && steps.parent-cache.outputs.hit != 'true'
        env:
          EMULATOR_OUTCOME: ${{ steps.native-ui.outcome }}
        run: |
          test "$VERIFY_FEATURE" = chat-shared.md
          test "$APP_REF" = 9198aad3721905b09931cdd85628988fe0bd3292
          test "$(cat "$EVIDENCE/app-source-sha.txt")" = "$APP_REF"
          test "$EMULATOR_OUTCOME" = failure
          jq -e '.engine_info.generation == 22 and .bundle_sha256 == "999ef191b364af22994311f4d8b168e22c67a7103585a0c22e0e9c1cc7a9c316" and (.snapshot | type) == "object" and (.snapshot | has("next_cursor")) and .snapshot.next_cursor == null and (.snapshot.items | type) == "array" and (.snapshot.items | length) == 0' "$EVIDENCE/shared-bootstrap.json" >/dev/null
          marker=$(cat "$EVIDENCE/shared-negative-marker.txt")
          case "$marker" in
            SHARED_HOST_RESET_NOT_APPLIED|SHARED_HOST_ADMISSION_MISSING) ;;
            SHARED_REMOTE_MESSAGE_NOT_VISIBLE)
              python3 .claude/skills/verify-multiprompt-android/scripts/shared-remote-oracle.py "$EVIDENCE/shared-remote-missing-host.json" "$EVIDENCE/shared-remote-missing-ui.xml" --self-check
              ;;
            *) exit 1 ;;
          esac
          printf 'ANDROID_303_SHARED_HOST_STATE_REJECTED\n' > "$EVIDENCE/shared-negative-result.txt"
      - name: Require the original native-skill failure
        id: require-native
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.expect_native_missing == 'true') && steps.parent-cache.outputs.hit != 'true'
        env:
          EMULATOR_OUTCOME: ${{ steps.native-ui.outcome }}
        run: |
          test "$VERIFY_FEATURE" = native-skills.md
          test "$APP_REF" = 2cd0154674ced41a3733ba1b0bd90faef168eb41
          test "$(cat "$EVIDENCE/app-source-sha.txt")" = "$APP_REF"
          test "$EMULATOR_OUTCOME" = failure
          grep -F 'NATIVE_SLASH_PICKER_MISSING' "$EVIDENCE/driver-transcript.txt"
          printf '%s\n' '{"status":"expected-red","error":"NATIVE_SLASH_PICKER_MISSING"}' > "$EVIDENCE/native-baseline-result.json"
      - name: Require the original shell swipe failure
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (always() && github.event_name == 'workflow_dispatch' && github.event.inputs.expect_shell_missing == 'true') && steps.parent-cache.outputs.hit != 'true'
        env:
          EMULATOR_OUTCOME: ${{ steps.native-ui.outcome }}
        run: |
          test "$VERIFY_FEATURE" = terminal.md
          test "$APP_REF" = 7f640c6336ebdc63b37373f141c656bc9dbcb0d5
          test "$(cat "$EVIDENCE/app-source-sha.txt")" = "$APP_REF"
          test "$EMULATOR_OUTCOME" = failure
          grep -Fx SHELL_HISTORY_0001 "$EVIDENCE/shell-history-before.txt"
          grep -Fx SHELL_HISTORY_0500 "$EVIDENCE/shell-history-before.txt"
          grep -F 'Timed out waiting for SHELL_HISTORY_' "$EVIDENCE/driver-transcript.txt"
          printf 'ORIGINAL_SHELL_SWIPE_REJECTED\n' > "$EVIDENCE/shell-baseline-result.txt"
      - name: Retain emulator exit and host memory evidence
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: (always()) && steps.parent-cache.outputs.hit != 'true'
        run: |
          mkdir -p "$EVIDENCE/emulator-diagnostics"
          if [ -f /tmp/native-emulator.log ]; then cp /tmp/native-emulator.log "$EVIDENCE/emulator-diagnostics/"; fi
          if [ -d /tmp/android-runner ]; then cp -a /tmp/android-runner "$EVIDENCE/emulator-diagnostics/crashes"; fi
          sudo dmesg -T > "$EVIDENCE/emulator-diagnostics/kernel.txt"
          free -m > "$EVIDENCE/emulator-diagnostics/memory.txt"
          ps -eo pid,ppid,stat,rss,args > "$EVIDENCE/emulator-diagnostics/processes.txt"
      - name: Stop recorded fixture processes and retain logs
        continue-on-error: ${{ inputs.side == 'parent' }}
        timeout-minutes: 2
        if: (always()) && steps.parent-cache.outputs.hit != 'true'
        run: |
          if [[ -d "$EVIDENCE/break-it" ]]; then export EVIDENCE="$EVIDENCE/break-it"; fi
          .claude/skills/verify-multiprompt-android/scripts/cleanup.sh
      - name: Record the parent result for the judge
        if: (always() && inputs.side == 'parent') && steps.parent-cache.outputs.hit != 'true'
        continue-on-error: true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$EVIDENCE"
          driver=$(cat "$EVIDENCE/parent-driver-exit.txt" 2>/dev/null || true)
          [[ "$driver" =~ ^[0-9]+$ ]] || driver=-1
          class=$(cat "$EVIDENCE/failure-class.txt" 2>/dev/null || true)
          product=false
          if [[ "$class" == "PRODUCT_ASSERTION_FAILED" ]]; then product=true; fi
          jq -n --argjson steps "$STEPS_JSON" --argjson driver "$driver" --argjson product "$product" '{side: "parent", passed: (($driver == 0) and ($steps["native-ui"].outcome == "success") and ([$steps[] | .outcome] | all(. == "success" or . == "skipped"))), productAssertion: $product, driverExit: $driver, steps: ($steps | map_values(.outcome))}' > "$EVIDENCE/side-result.json"
      - name: Validate reusable base evidence
        id: cache-result
        if: always() && inputs.side == 'parent' && steps.parent-cache.outputs.hit != 'true'
        continue-on-error: true
        run: node .github/scripts/pstack-verifier/parent-cache.cjs save
      - name: Retain reusable base evidence across pull requests
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: always() && steps.cache-result.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ${{ steps.cache-result.outputs.key }}
          path: verification-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload evidence even on failure
        continue-on-error: ${{ inputs.side == 'parent' }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: verify-${{ env.VERIFY_JOURNEY }}-${{ github.run_id }}${{ inputs.side == 'parent' && '-parent' || '' }}${{ inputs.side && inputs.side != 'head' && inputs.side != 'parent' && format('-{0}', inputs.side) || '' }}
          path: verification-evidence/
          if-no-files-found: error
          retention-days: 7
