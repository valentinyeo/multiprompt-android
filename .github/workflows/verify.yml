name: Verify real Android UI

on:
  push:
    branches: [ceo/IGSH-1012, ceo/IGSH-1069, ceo/IGSH-1076]
  pull_request:
    paths:
      - 'app/**'
      - 'tools/native-skills.test.py'
      - 'tools/release-choices/**'
      - '.claude/skills/verify-multiprompt-android/**'
      - '.github/workflows/verify.yml'
      - '.github/actions/android-proof/**'
  workflow_dispatch:
    inputs:
      released_terminal:
        description: Verify 500-line shell scrolling on the published signed APK
        type: boolean
        default: false
      release_icon:
        description: Verify the approved launcher icon on the published signed APK
        type: boolean
        default: false
      release_choices:
        description: Verify plain lists and real question answers on the signed release APK
        type: boolean
        default: false
      released_reactions:
        description: Verify reaction display and transport on the signed APK
        type: boolean
        default: false
      candidate:
        description: Build signed branch candidate instead of downloading the published APK
        type: boolean
        default: false
      expected_commit:
        description: Required published manifest commit for release choices proof
        type: string
      feature:
        description: User journey from the verification feature map
        required: true
        type: choice
        options:
          - sign-in.md
          - hosts.md
          - hosts-retired.md
          - host-changed-key.md
          - sessions.md
          - session-reader.md
          - chat-choices.md
          - chat-reactions.md
          - chat-queued.md
          - native-skills.md
          - chat-resync.md
          - session-routing.md
          - terminal.md
          - launcher-icon.md
      expect_native_missing:
        description: Require the original app to reject the native slash journey
        required: false
        type: boolean
        default: false
      app_ref:
        description: Optional pinned app source for the unchanged journey negative control or published source
        required: false
        type: string
      update_baseline_run:
        description: Earlier reactions workflow run holding the signed update baseline
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: ${{ inputs.expect_native_missing && 'original native-skill control' || 'verify' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EVIDENCE: ${{ github.workspace }}/verification-evidence
      VERIFY_FEATURE: ${{ inputs.feature || ((github.head_ref == 'ceo/IGSH-1076' || startsWith(github.ref, 'refs/heads/ceo/IGSH-1076')) && 'terminal.md') || (github.event_name == 'push' && github.ref == 'refs/heads/ceo/IGSH-1069' && 'chat-choices.md') || (github.event_name == 'push' && github.ref == 'refs/heads/ceo/IGSH-1012' && 'chat-reactions.md') || 'native-skills.md' }}
      EXPECTED_VERSION: 0.1.2-verify.${{ github.run_number }}-debug
      UPDATE_BASELINE_RUN: ${{ inputs.update_baseline_run }}
      APP_REF: ${{ inputs.app_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verification paths
        run: |
          mkdir -p "$EVIDENCE"
          echo "FIXTURE=$RUNNER_TEMP/verify-ssh" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/checkout@v4
        if: env.APP_REF != ''
        with:
          ref: ${{ env.APP_REF }}
          path: app-source
      - name: Capture signed update baseline
        if: env.VERIFY_FEATURE == 'chat-reactions.md' && inputs.update_baseline_run == ''
        run: |
          mkdir -p "$EVIDENCE/signed-update-baseline"
          curl -fsSL https://github.com/valentinyeo/multiprompt-android/releases/download/android-latest/multiprompt-companion-update.json -o "$EVIDENCE/signed-update-baseline/manifest.json"
          curl -fsSL "$(jq -er '.apkUrl' "$EVIDENCE/signed-update-baseline/manifest.json")" -o "$EVIDENCE/signed-update-baseline/app.apk"
          printf '%s  %s\n' "$(jq -er '.sha256' "$EVIDENCE/signed-update-baseline/manifest.json")" "$EVIDENCE/signed-update-baseline/app.apk" | sha256sum --check
      - name: Restore signed update baseline
        if: inputs.update_baseline_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.update_baseline_run }}
        run: |
          [[ "$BASELINE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name "verify-chat-reactions.md-$BASELINE_RUN" --dir "$RUNNER_TEMP/update-baseline"
          cp -a "$RUNNER_TEMP/update-baseline/signed-update-baseline" "$EVIDENCE/"
      - name: Check reaction screenshot oracle
        run: |
          python3 -m pip install Pillow
          python3 .claude/skills/verify-multiprompt-android/scripts/reactions.test.py
      - name: Prepare signed choices APK and same-signer fixture instrumentation
        if: inputs.release_choices == true || inputs.released_reactions == true || inputs.released_terminal == true
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [[ "$VERIFY_FEATURE" = chat-choices.md || "$VERIFY_FEATURE" = chat-reactions.md || "$VERIFY_FEATURE" = terminal.md ]]
          sdkmanager --install 'build-tools;35.0.0' 'platforms;android-35'
          bash tools/release-choices/prepare.sh
          echo "VERIFY_APK=$EVIDENCE/app.apk" >> "$GITHUB_ENV"
          echo "VERIFY_PACKAGE=dev.multiprompt.companion" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION=$(cat "$EVIDENCE/version.txt")" >> "$GITHUB_ENV"
      - name: Download published icon APK
        if: inputs.release_icon == true
        run: |
          test "$VERIFY_FEATURE" = launcher-icon.md
          python3 -m pip install Pillow
          python3 .claude/skills/verify-multiprompt-android/scripts/launcher-icon.test.py
          curl -fsSL https://github.com/valentinyeo/multiprompt-android/releases/download/android-latest/multiprompt-companion-update.json -o "$EVIDENCE/manifest.json"
          curl -fsSL "$(jq -er '.apkUrl' "$EVIDENCE/manifest.json")" -o "$EVIDENCE/app.apk"
          printf '%s  %s\n' "$(jq -er '.sha256' "$EVIDENCE/manifest.json")" "$EVIDENCE/app.apk" | sha256sum --check
          echo "VERIFY_APK=$EVIDENCE/app.apk" >> "$GITHUB_ENV"
          echo "VERIFY_PACKAGE=dev.multiprompt.companion" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION=$(jq -er '.versionName' "$EVIDENCE/manifest.json")" >> "$GITHUB_ENV"
      - name: Build debug APK
        if: inputs.release_choices != true && inputs.release_icon != true && inputs.released_reactions != true && inputs.released_terminal != true
        run: |
          mkdir -p "$EVIDENCE"
          python3 .claude/skills/verify-multiprompt-android/scripts/launcher-icon.test.py
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE/revision.txt"
          app_source="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/app-source" ]; then app_source="$GITHUB_WORKSPACE/app-source"; fi
          git -C "$app_source" rev-parse HEAD > "$EVIDENCE/app-source-sha.txt"
          gradle -p "$app_source" --no-daemon -Dorg.gradle.jvmargs=-Xmx3g -PversionName="0.1.2-verify.$GITHUB_RUN_NUMBER" assembleDebug 2>&1 | tee "$EVIDENCE/build.txt"
          echo "VERIFY_APK=$app_source/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          sha256sum "$app_source/app/build/outputs/apk/debug/app-debug.apk" > "$EVIDENCE/app-apk-sha256.txt"
      - name: Build routing instrumentation
        if: inputs.feature == 'session-routing.md'
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g assembleDebugAndroidTest
      - name: Start ephemeral public-key-only SSH and tmux
        run: .claude/skills/verify-multiprompt-android/scripts/fixture.sh
      - name: Install, doctor and drive the real app
        id: native-ui
        continue-on-error: ${{ inputs.expect_native_missing == true }}
        uses: ./.github/actions/android-proof
        with:
          stage: stage-1
          target: default
          script: |
            adb install -r -g "$VERIFY_APK"
            if [ "${VERIFY_PACKAGE:-}" = dev.multiprompt.companion ] && [ "$VERIFY_FEATURE" != launcher-icon.md ]; then bash tools/release-choices/run.sh; else .claude/skills/verify-multiprompt-android/scripts/drive.sh "$VERIFY_FEATURE"; fi
            if [ -n "$UPDATE_BASELINE_RUN" ]; then .claude/skills/verify-multiprompt-android/scripts/update-reaction-release.sh; fi
      - name: Require the original native-skill failure
        if: inputs.expect_native_missing == true
        env:
          EMULATOR_OUTCOME: ${{ steps.native-ui.outcome }}
        run: |
          test "$VERIFY_FEATURE" = native-skills.md
          test "$APP_REF" = 2cd0154674ced41a3733ba1b0bd90faef168eb41
          test "$(cat "$EVIDENCE/app-source-sha.txt")" = "$APP_REF"
          test "$EMULATOR_OUTCOME" = failure
          grep -F 'NATIVE_SLASH_PICKER_MISSING' "$EVIDENCE/driver-transcript.txt"
          printf '%s\n' '{"status":"expected-red","error":"NATIVE_SLASH_PICKER_MISSING"}' > "$EVIDENCE/native-baseline-result.json"
      - name: Retain emulator exit and host memory evidence
        if: always()
        run: |
          mkdir -p "$EVIDENCE/emulator-diagnostics"
          if [ -f /tmp/native-emulator.log ]; then cp /tmp/native-emulator.log "$EVIDENCE/emulator-diagnostics/"; fi
          if [ -d /tmp/android-runner ]; then cp -a /tmp/android-runner "$EVIDENCE/emulator-diagnostics/crashes"; fi
          sudo dmesg -T > "$EVIDENCE/emulator-diagnostics/kernel.txt"
          free -m > "$EVIDENCE/emulator-diagnostics/memory.txt"
          ps -eo pid,ppid,stat,rss,args > "$EVIDENCE/emulator-diagnostics/processes.txt"
      - name: Stop recorded fixture processes and retain logs
        timeout-minutes: 2
        if: always()
        run: .claude/skills/verify-multiprompt-android/scripts/cleanup.sh
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ env.VERIFY_FEATURE }}-${{ github.run_id }}
          path: verification-evidence/
          if-no-files-found: error
          retention-days: 7
