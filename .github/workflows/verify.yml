name: Verify real Android UI

on:
  workflow_dispatch:
    inputs:
      feature:
        description: User journey from the verification feature map
        required: true
        type: choice
        options:
          - sign-in.md
          - hosts.md
          - sessions.md
          - session-reader.md
          - terminal.md

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EVIDENCE: ${{ github.workspace }}/verification-evidence
      VERIFY_FEATURE: ${{ inputs.feature }}
      EXPECTED_VERSION: 0.1.2-verify.${{ github.run_number }}-debug
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verification paths
        run: |
          mkdir -p "$EVIDENCE"
          echo "FIXTURE=$RUNNER_TEMP/verify-ssh" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build debug APK
        run: |
          mkdir -p "$EVIDENCE"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE/revision.txt"
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g -PversionName="0.1.2-verify.$GITHUB_RUN_NUMBER" assembleDebug 2>&1 | tee "$EVIDENCE/build.txt"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start ephemeral public-key-only SSH and tmux
        run: .claude/skills/verify-multiprompt-android/scripts/fixture.sh
      - name: Install, doctor and drive the real app
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            .claude/skills/verify-multiprompt-android/scripts/drive.sh "$VERIFY_FEATURE"
      - name: Stop recorded fixture processes and retain logs
        timeout-minutes: 2
        if: always()
        run: .claude/skills/verify-multiprompt-android/scripts/cleanup.sh
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ inputs.feature }}-${{ github.run_id }}
          path: verification-evidence/
          if-no-files-found: error
          retention-days: 7
