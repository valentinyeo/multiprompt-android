name: Android tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: No code comments
        run: node tools/strip-comments.mjs --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Root files, comments, lint and unit tests
        env:
          GRADLE: gradle
        run: tools/check.sh

      - name: Upload chat screenshots and JVM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-regression-proof
          path: |
            app/build/reports/igsh-844/*.png
            app/build/test-results/test*UnitTest/*.xml

  image-preview-emulator:
    name: image-preview-emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p build
            status=0
            gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.multiprompt.companion.ui.ChatImagePreviewTest || status=$?
            adb logcat -d > build/image-preview-logcat.txt
            adb exec-out screencap -p > build/image-preview-screen.png
            if [ "$status" -eq 0 ]; then adb pull /sdcard/Android/data/dev.multiprompt.companion.debug/files/image-unfurl.png build/image-unfurl.png; fi
            exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-preview-emulator
          path: |
            build/image-unfurl.png
            build/image-preview-logcat.txt
            build/image-preview-screen.png
            app/build/reports/androidTests/connected
          if-no-files-found: error
