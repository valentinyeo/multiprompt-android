name: Android tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Build the app
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g assembleDebug

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check the feature registry
        run: node .github/scripts/pstack-verifier/coverage.cjs check

      - name: No code comments
        run: node tools/strip-comments.mjs --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Install screenshot text reader
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tmux
          python3 -m pip install Pillow

      - name: PR title names a ticket with its exact title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/release-notes/notes.mjs --pr-title "$PR_TITLE"

      - name: Source files, comments and tool checks
        env:
          GRADLE: gradle
        run: tools/check.sh source

      - name: Upload chat screenshots and JVM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: chat-regression-proof
          path: |
            app/build/reports/igsh-844/*.png
            app/build/reports/igsh-1045/*.png
            app/build/reports/igsh-1015/*.png
            app/build/reports/igsh-1173/*.png
            app/build/reports/igsh-1317/*.png
            app/build/outputs/igsh-423/*.png
            app/build/test-results/test*UnitTest/*.xml


  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Debug unit tests
        env:
          GRADLE: gradle
        run: tools/check.sh unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: unit-tests-results
          path: |
            app/build/reports/igsh-844/*.png
            app/build/reports/igsh-1045/*.png
            app/build/reports/igsh-1015/*.png
            app/build/reports/igsh-1547/*.png
            app/build/reports/igsh-1173/*.png
            app/build/reports/igsh-1317/*.png
            app/build/outputs/igsh-423/*.png
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore


  m3-unit-tests:
    name: m3-unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Material 3 unit tests
        env:
          GRADLE: gradle
        run: tools/check.sh m3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: m3-unit-tests-results
          path: app/build/test-results/testM3UnitTest/*.xml
          if-no-files-found: ignore


  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Android lint
        env:
          GRADLE: gradle
        run: tools/check.sh lint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: kit-controls-proof
          path: |
            tools/kit-controls/build/test-results/test/*.xml
            app/build/reports/kit-controls/*.xml
            app/build/reports/lint-results-*.xml
          if-no-files-found: error
