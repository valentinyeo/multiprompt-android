name: Android tests

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Optional original commit for before and after theme proof
        type: string
        required: false
      released_update:
        description: Install and inspect the published signed update
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: No code comments
        run: node tools/strip-comments.mjs --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Install screenshot text reader
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tmux

      - name: Root files, comments, lint and unit tests
        env:
          GRADLE: gradle
        run: tools/check.sh

      - name: Upload chat screenshots and JVM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-regression-proof
          path: |
            app/build/reports/igsh-844/*.png
            app/build/test-results/test*UnitTest/*.xml

  image-preview-emulator:
    name: image-preview-emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Install screenshot comparison tool
        run: |
          python3 -m pip install Pillow
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Build test APKs before starting the emulator
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g -Pkotlin.compiler.execution.strategy=in-process assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: bash tools/check-image-preview.sh
        env:
          GRADLE: gradle
      - name: Verify day theme in a fresh emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: bash tools/check-day-theme.sh
        env:
          GRADLE: gradle
          DAY_THEME_BASE_REF: ${{ inputs.baseline_ref }}
          DAY_THEME_RELEASED_UPDATE: ${{ inputs.released_update }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-preview-emulator
          path: |
            build/day-theme/
            build/image-unfurl.png
            build/image-preview-logcat.txt
            build/image-preview-screen.png
            app/build/reports/androidTests/connected
          if-no-files-found: error

  reply-notifications-emulator:
    name: reply-notifications-emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: bash tools/check-reply-notifications.sh
        env:
          GRADLE: gradle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reply-notifications-emulator
          path: |
            build/reply-notifications-shade.png
            build/favorite-only-notifications-shade.png
            build/reply-notifications-logcat.txt
            build/reply-notifications-screen.png
            app/build/reports/androidTests/connected
          if-no-files-found: error

  session-rows-emulator:
