name: Android tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: No code comments
        run: node tools/strip-comments.mjs --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Root files, comments, lint and unit tests
        env:
          GRADLE: gradle
        run: tools/check.sh

      - name: Upload chat screenshots and JVM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-regression-proof
          path: |
            app/build/reports/igsh-844/*.png
            app/build/test-results/test*UnitTest/*.xml
