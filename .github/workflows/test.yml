            app/build/reports/androidTests/connected
          if-no-files-found: error

  message-actions-emulator:
    name: message-actions-emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Install screenshot text reader
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: bash tools/check-message-actions.sh
        env:
          GRADLE: gradle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: message-actions-emulator
          path: |
            build/message-actions/
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: error

  approved-style-emulator:
    name: approved-style-emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Install screenshot text reader
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build original screen APKs before starting the emulator
        run: bash tools/check-approved-style.sh prepare
        env:
          GRADLE: gradle
          STYLE_PHASE: before
      - name: Reject unapproved original screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: bash tools/check-approved-style.sh
        env:
          GRADLE: gradle
          STYLE_PHASE: before
      - name: Build approved screen APKs before restarting the emulator
        run: bash tools/check-approved-style.sh prepare
        env:
          GRADLE: gradle
          STYLE_PHASE: after
      - name: Verify approved screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: bash tools/check-approved-style.sh
        env:
          GRADLE: gradle
          STYLE_PHASE: after
      - name: Capture host memory and emulator exit evidence
        if: always()
        run: |
          mkdir -p build/approved-style/diagnostics
          sudo dmesg -T > build/approved-style/diagnostics/kernel.txt
          free -m > build/approved-style/diagnostics/memory.txt
          ps -eo pid,ppid,stat,rss,args > build/approved-style/diagnostics/processes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-style-emulator
          path: |
            build/approved-style/
            app/build/reports/androidTests/connected
          if-no-files-found: error
