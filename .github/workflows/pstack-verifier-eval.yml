name: pstack-verifier reliability

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - .github/scripts/pstack-verifier/**
      - .github/workflows/pstack-verifier-eval.yml
      - tools/pstack-verifier-eval.test.js

permissions:
  contents: read

concurrency:
  group: pstack-verifier-reliability-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  reliability:
    name: verifier reliability (${{ matrix.family }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        family: [deepseek, claude]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Prove blinding and failure handling
        run: node --test tools/pstack-verifier-eval.test.js
      - name: Install Claude Code
        if: matrix.family == 'claude'
        run: npm i -g @anthropic-ai/claude-code@2.1.326
      - name: Run DeepSeek flash
        if: matrix.family == 'deepseek'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPORT_DIR: ${{ runner.temp }}/verifier-results
        run: node .github/scripts/pstack-verifier/eval.cjs deepseek
      - name: Run Claude Haiku
        if: matrix.family == 'claude'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPORT_DIR: ${{ runner.temp }}/verifier-results
        run: node .github/scripts/pstack-verifier/eval.cjs claude
      - name: Retain every request, answer and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-reliability-${{ matrix.family }}
          path: ${{ runner.temp }}/verifier-results
          if-no-files-found: error
          retention-days: 14
