name: Maintain Android feature map

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check sources and plan journeys without driving Android or publishing a PR
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: maintain-android-feature-map
  cancel-in-progress: true

jobs:
  map:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      app_name: ${{ steps.plan.outputs.app_name }}
      working_dots: ${{ steps.plan.outputs.working_dots }}
      photo: ${{ steps.plan.outputs.photo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan every registered journey
        id: plan
        run: |
          mkdir -p maintenance-evidence
          python3 -B tools/maintain-verification.test.py 2>&1 | tee maintenance-evidence/maintenance-tests.txt
          python3 -B .claude/skills/verify-multiprompt-android/scripts/maintain.py plan | tee maintenance-evidence/plan.json
      - name: Check source and refresh moved locations
        run: |
          mkdir -p maintenance-evidence
          script=.claude/skills/verify-multiprompt-android/scripts/control_map.py
          before=0
          python3 -B "$script" check > maintenance-evidence/source-before.txt 2>&1 || before=$?
          live=0
          CONTROL_MAP_LIVE=1 python3 -B .claude/skills/verify-multiprompt-android/scripts/control_map.test.py > maintenance-evidence/control-tests.txt 2>&1 || live=$?
          cat maintenance-evidence/control-tests.txt
          python3 -B "$script" locations
          after=0
          python3 -B "$script" check > maintenance-evidence/source-after.txt 2>&1 || after=$?
          registry=0
          node .github/scripts/pstack-verifier/coverage.cjs check > maintenance-evidence/registry.txt 2>&1 || registry=$?
          printf '{"before":%s,"after":%s,"registry":%s}\n' "$before" "$after" "$registry" > maintenance-evidence/source-result.json
          printf 'control map tool tests exit=%s\n' "$live" > maintenance-evidence/control-tests-result.txt
          cp .claude/skills/verify-multiprompt-android/features/controls.json maintenance-evidence/controls.json
          cat maintenance-evidence/source-before.txt maintenance-evidence/source-after.txt
      - name: Report coverage ratchets against last week
        continue-on-error: true
        run: |
          mkdir -p maintenance-evidence
          base=$(git rev-list -1 --before='7 days ago' HEAD || true)
          base=${base:-HEAD^}
          first=$(git log --reverse --format=%H -- .claude/skills/verify-multiprompt-android/features/control-gaps.json | head -n 1 || true)
          if [ -n "$first" ] && git merge-base --is-ancestor "$base" "$first"; then base=$first; fi
          set +e
          BASE_SHA="$base" node .github/scripts/pstack-verifier/coverage.cjs check 2>&1 | tee maintenance-evidence/ratchet-registry.txt
          registry=$?
          python3 -B .claude/skills/verify-multiprompt-android/scripts/control_map.py check --base "$base" 2>&1 | tee maintenance-evidence/ratchet-controls.txt
          controls=$?
          printf 'ratchet base=%s registry=%s controls=%s\n' "$base" "$registry" "$controls" | tee maintenance-evidence/ratchet-result.txt
          [ "$registry" -eq 0 ] && [ "$controls" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: maintenance-map
          path: maintenance-evidence/
          if-no-files-found: error
          retention-days: 14

  journeys:
    name: journey ${{ matrix.journey }}
    needs: map
    if: inputs.dry_run != true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.map.outputs.matrix) }}
    uses: ./.github/workflows/verify.yml
    with:
      feature: ${{ matrix.feature }}
      side: ${{ matrix.journey }}
      released_chat: ${{ matrix.released_chat }}
      released_robots: ${{ matrix.released_robots }}
      release_choices: ${{ matrix.release_choices }}
      pins_scroll: ${{ matrix.pins_scroll }}
      candidate: ${{ matrix.candidate }}
    secrets: inherit

  app-name:
    name: journey app-name.md
    needs: map
    if: inputs.dry_run != true && needs.map.outputs.app_name == 'true'
    uses: ./.github/workflows/app-name.yml
    secrets: inherit

  working-dots:
    name: journey chat-working.md
    needs: map
    if: inputs.dry_run != true && needs.map.outputs.working_dots == 'true'
    uses: ./.github/workflows/working-dots.yml
    secrets: inherit

  photo:
    name: journey bot-photo-refresh.md
    needs: map
    if: inputs.dry_run != true && needs.map.outputs.photo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Prove account photo publication
        env:
          GRADLE: gradle
        run: |
          tools/check.sh unit-red
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g testDebugUnitTest --tests '*AccountHostsAppTest*'
      - uses: ./.github/actions/android-proof
        with:
          stage: maintenance-photo
          script: bash tools/check-session-rows.sh
        env:
          GRADLE: gradle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: maintenance-photo
          path: |
            build/session-rows/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 14

  report:
    needs: [map, journeys, app-name, working-dots, photo]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: maintenance-map
          path: maintenance-evidence
      - name: Retain journey conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p maintenance-evidence
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > maintenance-evidence/jobs.json
      - name: Open one correction PR, never merge
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 -B .claude/skills/verify-multiprompt-android/scripts/maintain.py report maintenance-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: maintenance-report
          path: maintenance-evidence/
          if-no-files-found: error
          retention-days: 14
