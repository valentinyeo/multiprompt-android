name: Android scroll frame time

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      max_janky_percent:
        description: Fail above this share of janky frames, 0 to 100
        type: string
        required: false
        default: '60'
      max_p95_ms:
        description: Fail above this 95th percentile frame time in milliseconds
        type: string
        required: false
        default: '120'

permissions:
  contents: read

concurrency:
  group: scroll-jank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - uses: ./.github/actions/android-proof
        env:
          SCROLL_JANK_MAX_PERCENT: ${{ inputs.max_janky_percent || '60' }}
          SCROLL_JANK_MAX_P95_MS: ${{ inputs.max_p95_ms || '120' }}
        with:
          stage: scroll-jank
          script: |
            tools/scroll-jank-proof.sh
      - name: Publish the frame time report to the job summary
        if: always()
        run: |
          if [ -s build/scroll-jank/report.md ]; then
            cat build/scroll-jank/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No scroll frame time report was produced. The emulator artifact holds the diagnostics.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-jank-report
          path: build/scroll-jank/
          if-no-files-found: warn
