name: Chat bubble width proof

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      released:
        description: Verify the published signed APK
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  width:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(inputs.released && '["released"]' || '["before", "after"]') }}
    env:
      EVIDENCE: ${{ github.workspace }}/verification-evidence
      VERIFY_FEATURE: bubble-width.md
      VERIFY_PACKAGE: dev.multiprompt.companion
      CANDIDATE: ${{ matrix.phase == 'after' }}
      WIDTH_PHASE: ${{ matrix.phase }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare signed APK and platform-only observer
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 -m pip install Pillow
          sdkmanager --install 'build-tools;35.0.0' 'platforms;android-35'
          export EXPECTED_COMMIT="$(curl -fsSL https://github.com/valentinyeo/multiprompt-android/releases/download/android-latest/multiprompt-companion-update.json | jq -er .commit)"
          bash tools/release-choices/prepare.sh
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE/harness-sha.txt"
          if [[ "$WIDTH_PHASE" == released ]]; then
            git fetch --no-tags origin "$EXPECTED_COMMIT"
            git diff --exit-code "$EXPECTED_COMMIT" HEAD -- app/src/main app/build.gradle.kts gradle/libs.versions.toml
          fi
      - name: Start identical conversation fixture
        run: |
          echo "FIXTURE=$RUNNER_TEMP/width-ssh" >> "$GITHUB_ENV"
          export FIXTURE="$RUNNER_TEMP/width-ssh"
          bash .claude/skills/verify-multiprompt-android/scripts/fixture.sh
          sudo install -m 755 tools/bubble-width/fixture.py /home/verifyssh/width-fixture.py
          sudo -u verifyssh ln -s "$(command -v python3)" /home/verifyssh/claude
          sudo -u verifyssh tmux new-session -d -s cl-width-proof -x 100 -y 32 '/home/verifyssh/claude -u /home/verifyssh/width-fixture.py /home/verifyssh/width-source.json'
          sudo -u verifyssh tmux set-window-option -t cl-width-proof automatic-rename off
          sudo -u verifyssh tmux rename-window -t cl-width-proof cl-width-proof
      - uses: ./.github/actions/android-proof
        with:
          stage: width-${{ matrix.phase }}
          target: google_apis
          script: bash tools/bubble-width/run.sh
      - name: Remove ephemeral fixture keys
        if: always()
        run: bash .claude/skills/verify-multiprompt-android/scripts/cleanup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubble-width-${{ matrix.phase }}
          path: verification-evidence/
          retention-days: 7
          if-no-files-found: error
