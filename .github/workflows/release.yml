name: Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Optional display version, for example 0.1.1
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Resolve version
        shell: bash
        run: |
          requested='${{ inputs.version_name }}'
          if [[ -n "$requested" ]]; then
            version_name="$requested"
          else
            version_name="0.1.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version name: $version_name" >&2
            exit 1
          fi
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required GitHub secret: $value" >&2
              exit 1
            fi
          done
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/multiprompt-companion.jks
          cat > keystore.properties <<EOF
          storeFile=signing/multiprompt-companion.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test and build signed APK
        run: >-
          gradle --no-daemon lintDebug test assembleRelease
          -PversionCode="$VERSION_CODE"
          -PversionName="$VERSION_NAME"

      - name: Build verified update manifest
        shell: bash
        run: |
          source_apk=app/build/outputs/apk/release/app-release.apk
          release_dir=build/android-release
          mkdir -p "$release_dir"
          cp "$source_apk" "$release_dir/multiprompt-companion.apk"
          sha256=$(sha256sum "$release_dir/multiprompt-companion.apk" | cut -d' ' -f1)
          size=$(stat -c%s "$release_dir/multiprompt-companion.apk")
          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/multiprompt-companion.apk" \
            --arg sha256 "$sha256" \
            --argjson sizeBytes "$size" \
            --arg notes "$(git log -10 --no-merges --pretty=format:'- %s')" \
            '{schemaVersion:1, versionCode:$versionCode, versionName:$versionName, apkUrl:$apkUrl, sha256:$sha256, sizeBytes:$sizeBytes, notes:$notes}' \
            > "$release_dir/multiprompt-companion-update.json"

      - name: Publish fixed android-latest channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            build/android-release/multiprompt-companion.apk
            build/android-release/multiprompt-companion-update.json
          )
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-latest "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit android-latest \
              --title "multiprompt Android $VERSION_NAME" \
              --notes "Self-updating Android companion. Version code $VERSION_CODE." \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-latest "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "multiprompt Android $VERSION_NAME" \
              --notes "Self-updating Android companion. Version code $VERSION_CODE." \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: multiprompt-companion-${{ env.VERSION_NAME }}
          path: build/android-release/*
          if-no-files-found: error
