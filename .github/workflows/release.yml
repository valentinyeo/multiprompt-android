name: Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Optional display version, for example 0.1.1
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    timeout-minutes: 55
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build
      GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: robolectric-warm-v1 # gitleaks:allow
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Scan release history for secrets
        timeout-minutes: 10
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-banner --source . --redact --log-opts "$GITHUB_SHA"

      - uses: actions/setup-java@v4
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: "17"

      - uses: ./.github/actions/gradle-ci
        timeout-minutes: 10
        with:
          read-only: true

      - name: Resolve version
        timeout-minutes: 2
        shell: bash
        env:
          REQUESTED: ${{ inputs.version_name }}
        run: |
          requested="$REQUESTED"
          if [[ -n "$requested" ]]; then
            version_name="$requested"
          else
            version_name="0.1.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version name: $version_name" >&2
            exit 1
          fi
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: Restore release signing key
        timeout-minutes: 2
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required GitHub secret: $value" >&2
              exit 1
            fi
          done
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/multiprompt-companion.jks
          cat > keystore.properties <<EOF
          storeFile=signing/multiprompt-companion.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APKs
        timeout-minutes: 15
        run: >-
          tools/ci/gradle-retry.sh --no-daemon assembleRelease assembleM3
          -PversionCode="$VERSION_CODE"
          -PversionName="$VERSION_NAME"

      - name: Check the baseline profile is compiled into both APKs
        timeout-minutes: 5
        run: node tools/baseline-profile.mjs apk app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/m3/app-m3.apk

      - name: Retain the R8 mapping of both APKs for retrace
        timeout-minutes: 5
        run: |
          mkdir -p build/r8-mapping
          for pair in release:multiprompt-companion m3:multiprompt-m3; do
            variant=${pair%%:*}
            name=${pair##*:}
            mapping="app/build/outputs/mapping/$variant/mapping.txt"
            test -s "$mapping"
            cp "$mapping" "build/r8-mapping/$name-mapping.txt"
            cp "$mapping" "build/r8-mapping/$name-$VERSION_NAME-mapping.txt"
          done
          wc -l build/r8-mapping/*.txt

      - name: Upload the R8 mapping as a release artifact
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ env.VERSION_NAME }}
          path: build/r8-mapping/
          if-no-files-found: error
          retention-days: 90

      - name: Enable emulator acceleration
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare launch evidence
        timeout-minutes: 2
        run: mkdir -p build/release-launch-evidence

      - name: Launch signed M3 APK
        id: release-launch
        uses: reactivecircus/android-emulator-runner@v2.34.0
        timeout-minutes: 5
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan -verbose > /tmp/android-proof-emulator.log 2>&1
          script: bash tools/release-launch.sh

      - name: Upload launch evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-launch-evidence
          path: build/release-launch-evidence/
          if-no-files-found: warn

      - name: Reject older releases
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for channel in android-latest android-m3-latest; do
            case "$channel" in
              android-latest) manifest=multiprompt-companion-update.json ;;
              *) manifest=multiprompt-m3-update.json ;;
            esac
            gh release view "$channel" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets"
            grep -Fx "$manifest" "$RUNNER_TEMP/assets"
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${channel}/${manifest}" -o "$RUNNER_TEMP/$manifest"
            previous_code=$(jq -er '.versionCode | select(type == "number" and . >= 0 and floor == .)' "$RUNNER_TEMP/$manifest")
            test "$VERSION_CODE" -gt "$previous_code"
          done

      - name: Build verified update manifest and carry forward its changelog history
        timeout-minutes: 5
        shell: bash
        run: |
          source_apk=app/build/outputs/apk/release/app-release.apk
          release_dir=build/android-release
          mkdir -p "$release_dir"
          cp "$source_apk" "$release_dir/multiprompt-companion.apk"
          sha256=$(sha256sum "$release_dir/multiprompt-companion.apk" | cut -d' ' -f1)
          size=$(stat -c%s "$release_dir/multiprompt-companion.apk")

          previous="$RUNNER_TEMP/manifest-previous.json"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/multiprompt-companion-update.json" -o "$previous" || echo '{}' > "$previous"
          previous_commit=$(jq -r '.commit // ""' "$previous")
          if [[ -n "$previous_commit" ]] && git cat-file -e "${previous_commit}^{commit}" 2>/dev/null; then
            notes=$(node tools/release-notes/notes.mjs --range "$previous_commit" HEAD)
          else
            notes=$(node tools/release-notes/notes.mjs --range "" HEAD)
          fi

          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/multiprompt-companion.apk" \
            --arg sha256 "$sha256" \
            --argjson sizeBytes "$size" \
            --arg notes "$notes" \
            --arg commit "$GITHUB_SHA" \
            '{schemaVersion:1, versionCode:$versionCode, versionName:$versionName, apkUrl:$apkUrl, sha256:$sha256, sizeBytes:$sizeBytes, notes:$notes, commit:$commit}' \
            > "$RUNNER_TEMP/manifest-base.json"
          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg date "$(date -u +%Y-%m-%d)" \
            --arg notes "$notes" \
            '{versionName:$versionName, versionCode:$versionCode, date:$date, notes:$notes}' \
            > "$RUNNER_TEMP/manifest-entry.json"
          node tools/release-notes/manifest-history.mjs \
            --manifest "$RUNNER_TEMP/manifest-base.json" \
            --entry "$RUNNER_TEMP/manifest-entry.json" \
            --previous "$previous" \
            --out "$release_dir/multiprompt-companion-update.json"

      - name: Reject an update manifest over 48 KB
        timeout-minutes: 5
        shell: bash
        run: node tools/release-notes/manifest-history.mjs --check build/android-release/multiprompt-companion-update.json

      - name: Publish fixed android-latest channel
        timeout-minutes: 5
        if: success() && steps.release-launch.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            build/android-release/multiprompt-companion.apk
            build/android-release/multiprompt-companion-update.json
            build/r8-mapping/multiprompt-companion-mapping.txt
          )
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-latest "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit android-latest \
              --title "multiprompt Android $VERSION_NAME" \
              --notes "Self-updating Android companion. Version code $VERSION_CODE." \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-latest "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "multiprompt Android $VERSION_NAME" \
              --notes "Self-updating Android companion. Version code $VERSION_CODE." \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Build M3 update manifest and carry forward its changelog history
        timeout-minutes: 5
        shell: bash
        run: |
          source_apk=app/build/outputs/apk/m3/app-m3.apk
          release_dir=build/android-m3
          mkdir -p "$release_dir"
          cp "$source_apk" "$release_dir/multiprompt-m3.apk"
          sha256=$(sha256sum "$release_dir/multiprompt-m3.apk" | cut -d' ' -f1)
          size=$(stat -c%s "$release_dir/multiprompt-m3.apk")

          previous="$RUNNER_TEMP/m3-manifest-previous.json"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-m3-latest/multiprompt-m3-update.json" -o "$previous" || echo '{}' > "$previous"
          previous_commit=$(jq -r '.commit // ""' "$previous")
          if [[ -n "$previous_commit" ]] && git cat-file -e "${previous_commit}^{commit}" 2>/dev/null; then
            notes=$(node tools/release-notes/notes.mjs --range "$previous_commit" HEAD)
          else
            notes=$(node tools/release-notes/notes.mjs --range "" HEAD)
          fi

          jq -n \
            --arg versionName "$VERSION_NAME-m3" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-m3-latest/multiprompt-m3.apk" \
            --arg sha256 "$sha256" \
            --argjson sizeBytes "$size" \
            --arg notes "$notes" \
            --arg commit "$GITHUB_SHA" \
            '{schemaVersion:1, versionCode:$versionCode, versionName:$versionName, apkUrl:$apkUrl, sha256:$sha256, sizeBytes:$sizeBytes, notes:$notes, commit:$commit}' \
            > "$RUNNER_TEMP/m3-manifest-base.json"
          jq -n \
            --arg versionName "$VERSION_NAME-m3" \
            --argjson versionCode "$VERSION_CODE" \
            --arg date "$(date -u +%Y-%m-%d)" \
            --arg notes "$notes" \
            '{versionName:$versionName, versionCode:$versionCode, date:$date, notes:$notes}' \
            > "$RUNNER_TEMP/m3-manifest-entry.json"
          node tools/release-notes/manifest-history.mjs \
            --manifest "$RUNNER_TEMP/m3-manifest-base.json" \
            --entry "$RUNNER_TEMP/m3-manifest-entry.json" \
            --previous "$previous" \
            --out "$release_dir/multiprompt-m3-update.json"

      - name: Reject an M3 update manifest over 48 KB
        timeout-minutes: 5
        shell: bash
        run: node tools/release-notes/manifest-history.mjs --check build/android-m3/multiprompt-m3-update.json

      - name: Publish fixed android-m3-latest channel
        timeout-minutes: 5
        if: success() && steps.release-launch.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            build/android-m3/multiprompt-m3.apk
            build/android-m3/multiprompt-m3-update.json
            build/r8-mapping/multiprompt-m3-mapping.txt
          )
          if gh release view android-m3-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-m3-latest "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit android-m3-latest \
              --latest=false \
              --title "Multiprompt M3 test app $VERSION_NAME" \
              --notes "Self-updating Android companion. Version code $VERSION_CODE." \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-m3-latest "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Multiprompt M3 test app $VERSION_NAME" \
              --notes "Self-updating Android companion. Version code $VERSION_CODE." \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          fi

      - uses: actions/upload-artifact@v4
        timeout-minutes: 10
        with:
          name: multiprompt-companion-${{ env.VERSION_NAME }}
          path: |
            build/android-release/*
            build/android-m3/*
            build/r8-mapping/*
          if-no-files-found: error
