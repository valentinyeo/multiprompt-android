name: Chat list snapshot control

on:
  push:
    branches: [mpa/mubo-307b]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: robolectric-warm-v1 # gitleaks:allow

jobs:
  snapshots:
    name: snapshots (${{ matrix.revision }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [HEAD, 5f59c7fb, b70f2ef5]
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out complete historical app with the same test
        if: matrix.revision != 'HEAD'
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/snapshot-app" "$REVISION"
          cp app/src/test/java/dev/multiprompt/companion/ui/ChatListSnapshotTest.kt "$RUNNER_TEMP/snapshot-app/app/src/test/java/dev/multiprompt/companion/ui/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'snapshot-app/app/src/main/java/dev/multiprompt/companion/ui/MultipromptApp.kt'
          source = path.read_text()
          signature = '    onSetPinned: (TmuxSession, Boolean) -> Unit = { _, _ -> },\n) = MultipromptTheme('
          assert source.count(signature) == 1
          source = source.replace(signature, '    onSetPinned: (TmuxSession, Boolean) -> Unit = { _, _ -> },\n    sessionListState: androidx.compose.foundation.lazy.LazyListState = rememberLazyListState(),\n) = MultipromptTheme(')
          declaration = '    val sessionListState = rememberLazyListState()\n'
          assert source.count(declaration) == 1
          path.write_text(source.replace(declaration, ''))
          PY
          git -C "$RUNNER_TEMP/snapshot-app" diff --stat
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/gradle-ci
        with:
          read-only: true
      - name: Run snapshot counters without emulator timing
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          if [ "$REVISION" != HEAD ]; then cd "$RUNNER_TEMP/snapshot-app"; fi
          git rev-parse HEAD
          timeout 16m "$GITHUB_WORKSPACE/tools/ci/gradle-retry.sh" --no-daemon -Dorg.gradle.jvmargs=-Xmx3g :app:testDebugUnitTest --tests '*ChatListSnapshotTest*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-list-snapshots-${{ matrix.revision }}
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            ${{ runner.temp }}/snapshot-app/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
