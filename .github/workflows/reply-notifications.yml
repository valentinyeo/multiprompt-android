name: Reply notification release proof

on:
  pull_request:
    paths:
      - 'app/**'
      - 'tools/reply-notifications/**'
      - 'tools/release-choices/prepare.sh'
      - '.github/workflows/reply-notifications.yml'
  workflow_dispatch:
    inputs:
      published_commit:
        description: Published signed APK commit; empty builds a signed candidate
        type: string
        required: false
      expect_command_notification:
        description: Require the original APK to fail by notifying about /rc
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notification-proof:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EVIDENCE: ${{ github.workspace }}/notification-evidence
      FIXTURE: ${{ github.workspace }}-notification-fixture
      VERIFY_PACKAGE: dev.multiprompt.companion
      EXPECTED_COMMIT: ${{ inputs.published_commit }}
      CANDIDATE: ${{ inputs.published_commit == '' }}
      SEED_SOURCE: tools/reply-notifications/Seed.java
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare signed app and isolated SSH session
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          bash tools/release-choices/prepare.sh
          bash .claude/skills/verify-multiprompt-android/scripts/fixture.sh
          sudo -u verifyssh tmux kill-session -t verify-session
          sudo install -m 755 tools/reply-notifications/console.py /home/verifyssh/notification-console.py
          sudo -u verifyssh ln -s "$(command -v python3)" /home/verifyssh/claude
          sudo -u verifyssh tmux new-session -d -s verify-session -x 100 -y 32 '/home/verifyssh/claude -u /home/verifyssh/notification-console.py'
          sudo -u verifyssh tmux set-window-option -t verify-session automatic-rename off
          sudo -u verifyssh tmux rename-window -t verify-session Checkout
          sudo install -m 755 tools/reply-notifications/tmux-input.py /home/verifyssh/notification-input.py
          sudo -u verifyssh python3 /home/verifyssh/notification-input.py > "$FIXTURE/client.log" 2>&1 &
          echo "$!" > "$FIXTURE/client.pid"
          for attempt in $(seq 1 20); do
            if sudo -u verifyssh tmux list-clients -t verify-session | grep -F xterm; then break; fi
            sleep 0.2
          done
          test -p /home/verifyssh/notification-input
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          fixture = Path(os.environ['FIXTURE'])
          evidence = Path(os.environ['EVIDENCE'])
          (fixture / 'config.json').write_text(json.dumps(dict(privateKey=(fixture / 'user-key').read_text(), fingerprint=(evidence / 'host-fingerprint.txt').read_text().strip())))
          PY
      - uses: ./.github/actions/android-proof
        id: reply-content
        continue-on-error: ${{ github.event.inputs.expect_command_notification == 'true' }}
        with:
          stage: reply-content
          script: bash tools/reply-notifications/run.sh
      - name: Require the original command-notification failure
        if: github.event.inputs.expect_command_notification == 'true'
        env:
          PROOF_OUTCOME: ${{ steps.reply-content.outcome }}
        run: |
          test "$PROOF_OUTCOME" = failure
          test -n "$EXPECTED_COMMIT"
          grep -Fx COMMAND_WRONGLY_NOTIFIED "$EVIDENCE/negative-control.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reply-notification-release-proof
          path: |
            notification-evidence/*.png
            notification-evidence/*.json
            notification-evidence/*.txt
          if-no-files-found: error
