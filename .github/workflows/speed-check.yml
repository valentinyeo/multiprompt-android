name: Android speed check

on:
  workflow_call:
    inputs:
      base_sha:
        description: Base revision to measure
        required: true
        type: string
      head_sha:
        description: Head revision to measure
        required: true
        type: string
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base revision to measure
        required: true
        type: string
      head_sha:
        description: Head revision to measure
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: speed-check-${{ inputs.base_sha }}-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  speed:
    name: chat list and inbox work
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build
      EVIDENCE: ${{ github.workspace }}/speed-evidence
      PROBES: app/src/test/java/dev/multiprompt/companion/ui/ChatListRemeasureTest.kt app/src/test/java/dev/multiprompt/companion/ui/ChatListSnapshotTest.kt
    steps:
      - name: Check the revisions
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" != "$HEAD_SHA" ]]
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the base and head revisions beside this workflow's revision
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            git cat-file -e "$sha^{commit}" || { echo "Revision $sha is not in this repository" >&2; exit 1; }
          done
          git worktree add --detach app-base "$BASE_SHA"
          git worktree add --detach app-head "$HEAD_SHA"
          mkdir -p "$EVIDENCE"
          {
            printf 'harness_revision=%s\n' "$(git rev-parse HEAD)"
            printf 'base_revision=%s\n' "$(git -C app-base rev-parse HEAD)"
            printf 'head_revision=%s\n' "$(git -C app-head rev-parse HEAD)"
          } | tee "$EVIDENCE/revisions.txt"
      - name: Copy this check's probes into both revisions
        run: |
          for side in app-base app-head; do
            for probe in $PROBES; do
              mkdir -p "$side/$(dirname "$probe")"
              cp "$probe" "$side/$probe"
            done
            python3 tools/speed-check/inbox-list-state.py "$side"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/gradle-ci
        with:
          read-only: true
      - name: Count the chat list and inbox work on the base revision
        id: base
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          tools/ci/gradle-retry.sh -p app-base --no-daemon -Dorg.gradle.jvmargs=-Xmx3g :app:testDebugUnitTest --tests '*ChatListRemeasureTest*' --tests '*ChatListSnapshotTest*' 2>&1 | tee "$EVIDENCE/base-test.txt"
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Count the chat list and inbox work on the head revision
        id: head
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          tools/ci/gradle-retry.sh -p app-head --no-daemon -Dorg.gradle.jvmargs=-Xmx3g :app:testDebugUnitTest --tests '*ChatListRemeasureTest*' --tests '*ChatListSnapshotTest*' 2>&1 | tee "$EVIDENCE/head-test.txt"
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Judge the inbox and chat list readings
        run: |
          reading() {
            local side=$1
            local target="$EVIDENCE/$side-remeasures.txt"
            : > "$target"
            for candidate in "$side/app/build" "$side/build"; do
              for name in chat-list-remeasures.txt chat-list-snapshots.txt; do
                if [ -s "$candidate/$name" ]; then cat "$candidate/$name" >> "$target"; fi
              done
            done
            grep -q '^CHAT_LIST_' "$target"
          }
          reading app-base || echo "the base revision wrote no remeasure reading"
          reading app-head || echo "the head revision wrote no remeasure reading"
          python3 tools/speed-check/report.py \
            --base "$EVIDENCE/app-base-remeasures.txt" \
            --head "$EVIDENCE/app-head-remeasures.txt" \
            --base-status '${{ steps.base.outputs.status }}' \
            --head-status '${{ steps.head.outputs.status }}' \
            --out "$EVIDENCE/speed"
      - name: Publish the speed report to the job summary
        if: always()
        run: |
          if [ -s "$EVIDENCE/speed/report.md" ]; then
            cat "$EVIDENCE/speed/report.md" >> "$GITHUB_STEP_SUMMARY"
            cat "$EVIDENCE/speed/info.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No speed report was produced. The artifact holds both test runs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain both test runs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: speed-check-${{ github.run_id }}
          path: speed-evidence/
          if-no-files-found: warn
          retention-days: 14
