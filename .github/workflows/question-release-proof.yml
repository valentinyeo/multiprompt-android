name: Signed question choices proof

on:
  push:
    branches: [ceo/IGSH-1066]
  workflow_dispatch:
  workflow_run:
    workflows: [Android release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: signed-questions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-questions:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE: ${{ github.workspace }}/signed-question-proof
      FIXTURE: ${{ github.workspace }}/question-ssh
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VERIFY_FEATURE: chat-choices.md
      VERIFY_PACKAGE: dev.multiprompt.companion
      EXPECTED_VERSION: 0.1.2-signed-proof
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore existing release signer
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p signing "$EVIDENCE"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/multiprompt-companion.jks
          cat > keystore.properties <<CONFIG
          storeFile=signing/multiprompt-companion.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          CONFIG
      - name: Build the unchanged minified release variant
        run: |
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx3g -PversionName="$EXPECTED_VERSION" assembleRelease
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/proof.apk"
      - name: Download the actual published APK
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsSL https://github.com/valentinyeo/multiprompt-android/releases/download/android-latest/multiprompt-companion-update.json -o "$EVIDENCE/manifest.json"
          test "$(jq -er '.commit' "$EVIDENCE/manifest.json")" = "$SOURCE_SHA"
          curl -fsSL "$(jq -er '.apkUrl' "$EVIDENCE/manifest.json")" -o "$RUNNER_TEMP/proof.apk"
          printf '%s  %s\n' "$(jq -er '.sha256' "$EVIDENCE/manifest.json")" "$RUNNER_TEMP/proof.apk" | sha256sum --check
          printf 'EXPECTED_VERSION=%s\n' "$(jq -er '.versionName' "$EVIDENCE/manifest.json")" >> "$GITHUB_ENV"
      - name: Record exact APK and signer
        run: |
          sha256sum "$RUNNER_TEMP/proof.apk" > "$EVIDENCE/apk-sha256.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/proof.apk" > "$EVIDENCE/certificate.txt"
      - name: Start ephemeral public-key-only SSH and tmux
        run: .claude/skills/verify-multiprompt-android/scripts/fixture.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          emulator-build: 16428233
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: |
            adb install -r -g "$RUNNER_TEMP/proof.apk"
            .claude/skills/verify-multiprompt-android/scripts/drive.sh chat-choices.md
            adb shell dumpsys package "$VERIFY_PACKAGE" > "$EVIDENCE/installed-package.txt"
            if grep -E 'pkgFlags=.*DEBUGGABLE' "$EVIDENCE/installed-package.txt"; then exit 1; fi
            printf 'RELEASED_STRUCTURED_QUESTIONS_OK\n' > "$EVIDENCE/released-questions-result.txt"
      - name: Clean up ephemeral fixture
        if: always()
        run: .claude/skills/verify-multiprompt-android/scripts/cleanup.sh
      - name: Retain proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-question-proof-${{ github.run_id }}
          path: signed-question-proof/
