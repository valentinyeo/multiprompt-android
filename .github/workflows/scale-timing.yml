name: Android phone timing at scale

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Commit to build the app from, empty builds this dispatch's revision
        type: string
        required: false
        default: ''
      typing:
        description: Measure single-key typing and middle edits on the largest scale chat
        type: boolean
        default: false
      assert_isolated:
        description: Require typing not to recompose the message list
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scale-timing-${{ github.ref }}-${{ inputs.app_ref || 'head' }}
  cancel-in-progress: false

jobs:
  measure:
    name: timing ${{ matrix.seed }} ${{ inputs.app_ref || 'head' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: ${{ inputs.typing && fromJSON('["scale"]') || fromJSON('["small","scale"]') }}
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build
      EVIDENCE: ${{ github.workspace }}/scale-evidence
      FIXTURE: ${{ github.workspace }}/verify-ssh
      TIMING_SEED: ${{ matrix.seed }}
      APP_REF: ${{ inputs.app_ref }}
      TYPING_ASSERT_ISOLATED: ${{ inputs.assert_isolated }}
      EXPECTED_VERSION: 0.1.2-verify.${{ github.run_number }}-debug
      VERIFY_FEATURE: ${{ matrix.seed == 'scale' && 'long-chat.md' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the measured app revision in its own worktree
        run: |
          mkdir -p "$EVIDENCE"
          app_source="$GITHUB_WORKSPACE"
          if [ -n "$APP_REF" ]; then
            git cat-file -e "$APP_REF^{commit}"
            git worktree add --detach app-source "$APP_REF"
            app_source="$GITHUB_WORKSPACE/app-source"
          fi
          APP_SOURCE="$app_source"
          printf 'APP_SOURCE=%s\n' "$app_source" >> "$GITHUB_ENV"
          printf 'TIMING_REF=%s\n' "$(git -C "$app_source" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git -C "$app_source" rev-parse HEAD | tee "$EVIDENCE/app-source-sha.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/gradle-ci
        with:
          read-only: true
      - name: Build the debug APK from the measured revision
        timeout-minutes: 35
        run: |
          tools/ci/gradle-retry.sh -p "$APP_SOURCE" --no-daemon -Dorg.gradle.jvmargs=-Xmx3g \
            -PversionName="0.1.2-verify.$GITHUB_RUN_NUMBER" assembleDebug assembleDebugAndroidTest 2>&1 | tee "$EVIDENCE/build.txt"
          printf 'VERIFY_APK=%s\n' "$APP_SOURCE/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          printf 'VERIFY_TEST_APK=%s\n' "$APP_SOURCE/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" >> "$GITHUB_ENV"
          sha256sum "$APP_SOURCE/app/build/outputs/apk/debug/app-debug.apk" | tee "$EVIDENCE/app-apk-sha256.txt"
      - name: Start the ephemeral public-key-only SSH and tmux fixture
        timeout-minutes: 15
        run: .claude/skills/verify-multiprompt-android/scripts/fixture.sh
      - name: Seed the owner-scale synthetic chats
        if: matrix.seed == 'scale'
        timeout-minutes: 20
        run: sudo python3 tools/scale-timing/hostseed.py seed --fixture tools/scale-chat/fixture.py --relay tools/scale-timing/relay.py --out "$EVIDENCE/scale-seed.json"
      - name: Measure every reader call on the fixture SSH channel
        if: matrix.seed != 'scale'
        run: sudo python3 tools/scale-timing/hostseed.py relay --relay tools/scale-timing/relay.py
      - name: Pick the timing targets from the seeded host
        run: sudo python3 tools/scale-timing/targets.py --seed "$TIMING_SEED" --out "$EVIDENCE/timing-targets.json"
      - name: Install, sign in and time the phone
        id: timing
        uses: ./.github/actions/android-proof
        with:
          stage: timing-${{ matrix.seed }}
          script: |
            adb install -r -g "$VERIFY_APK"
            adb install -r "$VERIFY_TEST_APK"
            if [ "${{ inputs.typing }}" = true ]; then
              python3 tools/scale-timing/typing.py 2>&1 | tee "$EVIDENCE/typing-table.md"
            else
              python3 tools/scale-timing/measure.py --seed "$TIMING_SEED" --ref "$TIMING_REF" \
                --targets "$EVIDENCE/timing-targets.json" --out "$EVIDENCE/timing" --evidence "$EVIDENCE" \
                --fixture "$FIXTURE" --expected-version "$EXPECTED_VERSION"
            fi
      - name: Publish this seed's timing table
        if: always()
        run: |
          if [ -s "$EVIDENCE/typing-table.md" ]; then
            cat "$EVIDENCE/typing-table.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ -s "$EVIDENCE/timing/timing.json" ]; then
            python3 tools/scale-timing/report.py --root "$EVIDENCE" --out "$EVIDENCE/timing-table.md" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'No timing measurement was produced. The emulator artifact holds the diagnostics.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain this seed's measurement and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: timing-${{ matrix.seed }}-${{ inputs.app_ref || 'head' }}
          path: scale-evidence/
          if-no-files-found: warn
          retention-days: 14

  table:
    name: timing table
    needs: measure
    if: always() && needs.measure.result != 'cancelled' && !inputs.typing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: timing-*-*
          path: measurements
      - name: Render the timing table
        run: python3 tools/scale-timing/report.py --root measurements --out measurements/report.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the table
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: timing-table
          path: measurements/
          retention-days: 14
