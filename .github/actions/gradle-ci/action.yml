name: Shared Gradle cache setup
description: Pins Gradle 9.5.1. Read-only jobs fall back to the newest cache for their key job so the Compose plugin and the Robolectric test jars are already on disk
inputs:
  read-only:
    description: When true, restore cache from GRADLE_BUILD_ACTION_CACHE_KEY_JOB without writing, falling back to the newest matching entry
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "9.5.1"
        gradle-home-cache-strict-match: ${{ inputs.read-only != 'true' }}
        cache-read-only: ${{ inputs.read-only == 'true' }}
    - name: Robolectric test jars on disk
      id: robolectric_jars
      shell: bash
      run: |
        cache="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1/org.robolectric"
        android_all=$({ find "$cache" -name 'android-all-instrumented-*.jar' 2>/dev/null || true; } | wc -l | tr -d ' ')
        native_runtime=$({ find "$cache" -name 'nativeruntime-dist-compat-*.jar' 2>/dev/null || true; } | wc -l | tr -d ' ')
        echo "robolectric cache: android-all-instrumented=$android_all nativeruntime-dist-compat=$native_runtime"
        if [ "$android_all" -gt 0 ] && [ "$native_runtime" -gt 0 ]; then
          echo "miss=false" >> "$GITHUB_OUTPUT"
          echo "robolectric cache hit: this job resolves the Robolectric jars from the restored Gradle cache"
        else
          echo "miss=true" >> "$GITHUB_OUTPUT"
          echo "robolectric cache miss: this job downloads the Robolectric jars from Maven Central"
        fi
    - name: Restore legacy Gradle cache without the warmed prefix
      if: inputs.read-only == 'true' && steps.robolectric_jars.outputs.miss == 'true' && env.GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.GRADLE_USER_HOME }}/caches
        key: legacy-gradle-home-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          gradle-home-v1|Linux-X64|${{ env.GRADLE_BUILD_ACTION_CACHE_KEY_JOB || github.job }}
    - name: Restore legacy Gradle dependency cache without the warmed prefix
      if: inputs.read-only == 'true' && steps.robolectric_jars.outputs.miss == 'true' && env.GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.GRADLE_USER_HOME }}/caches/modules-2
        key: legacy-gradle-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          gradle-dependencies-v1-
    - name: Robolectric test jars after legacy cache fallback
      if: inputs.read-only == 'true' && steps.robolectric_jars.outputs.miss == 'true' && env.GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX != ''
      shell: bash
      run: |
        cache="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1/org.robolectric"
        android_all=$({ find "$cache" -name 'android-all-instrumented-*.jar' 2>/dev/null || true; } | wc -l | tr -d ' ')
        native_runtime=$({ find "$cache" -name 'nativeruntime-dist-compat-*.jar' 2>/dev/null || true; } | wc -l | tr -d ' ')
        echo "robolectric cache after legacy fallback: android-all-instrumented=$android_all nativeruntime-dist-compat=$native_runtime"
        if [ "$android_all" -gt 0 ] && [ "$native_runtime" -gt 0 ]; then
          echo "robolectric legacy cache hit: this job resolves the Robolectric jars from main's build cache"
        else
          echo "robolectric legacy cache miss: this job still downloads the Robolectric jars from Maven Central"
        fi
