[extend]
useDefault = true

[[rules]]
id = "cloudflare-token-named-nearby"
description = "Cloudflare API token with Cloudflare named on the same line, including markdown table values missed by default rules"
regex = '''(?i)(?:cloudflare|\bcf\b|\bcf_|wrangler)[^\n]{0,120}?[`'"= ]([A-Za-z0-9_-]{40})(?:[`'"\s]|$)'''
secretGroup = 1
entropy = 3.5
keywords = ["cloudflare", "cf", "wrangler"]

[[rules]]
id = "quoted-token-named-nearby"
description = "Quoted long random value next to the word token, secret, key or password"
regex = '''(?i)(?:token|secret|api[ _-]?key|password)[^\n]{0,60}?[`'"]([A-Za-z0-9_-]{32,})[`'"]'''
secretGroup = 1
entropy = 4.0
keywords = ["token", "secret", "key", "password"]

[allowlist]
description = "Sync protocol test vectors: fixed test bytes from scripts/gen-sync-fixtures.py, not real keys"
paths = ['''^app/src/test/resources/sync/sync-protocol-v1-fixtures\.json$''']
